name: One-shot clean 100 IP PR

on:
  push:
    branches: [work/ip-100-finalize]
    paths: [.github/workflows/one-shot-ip-clean.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ip-100-finalize
          fetch-depth: 0
      - name: Restore unrelated generated outputs from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- game_source/dist/index.html game_source/dist/auction-ip/README.md game_source/docs/SCORING_BALANCE_MATRIX.json
          rm .github/workflows/one-shot-ip-clean.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep 100-IP change scoped to catalogue content'
          git push origin HEAD:work/ip-100-finalize
