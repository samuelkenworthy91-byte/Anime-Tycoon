name: Cast V2 pair coverage canonical bytes
on:
  push:
    branches: [design/cast-v2-canonical]
    paths: [.github/workflows/cast-v2-paircov-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/cast-v2-canonical
          fetch-depth: 0
      - name: Recreate and verify recovered pair coverage CSV
        shell: bash
        env:
          PAYLOAD: 
        run: |
          python - <<'PY'
          import base64,gzip,os
          from pathlib import Path
          out=Path('game_source/docs/cast-v2/CAST_V2_PAIR_COVERAGE.csv')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(gzip.decompress(base64.b64decode(os.environ['PAYLOAD'])))
          PY
          test "$(git hash-object game_source/docs/cast-v2/CAST_V2_PAIR_COVERAGE.csv)" = "09eacc1744600b7c60279c5ae8c10e00798e0a21"
      - name: Commit exact file and self-clean
        shell: bash
        run: |
          rm .github/workflows/cast-v2-paircov-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/docs/cast-v2/CAST_V2_PAIR_COVERAGE.csv .github/workflows/cast-v2-paircov-fix.yml
          git commit -m 'Cast V2 transfer: add canonical pair coverage CSV'
          git push origin HEAD:design/cast-v2-canonical
