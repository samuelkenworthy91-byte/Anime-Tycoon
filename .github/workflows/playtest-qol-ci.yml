name: Playtest QoL CI

on:
  push:
    branches:
      - feature/deeper-studio-loop
    paths:
      - ".github/workflows/playtest-qol-ci.yml"
      - "tools/apply_playtest_qol.py"

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/deeper-studio-loop

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Apply playtest QoL changes
        run: python tools/apply_playtest_qol.py

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Build browser playtest
        working-directory: game_source
        run: npm run build

      - name: Commit validated implementation and GitHack build
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source
          git add -f game_source/dist
          git commit -m "Refine rushes contracts and final billing"
          git push origin HEAD:feature/deeper-studio-loop
