name: Shared Poster Expansion Validation

on:
  push:
    branches:
      - poster-roster-expansion-2026-09-19
    paths:
      - "game_source/src/engine/generated/rivalPosterManifest.json"
      - "game_source/src/engine/generated/rivalPosterExpansionPlan.json"
      - "game_source/src/engine/rivalPosters.ts"
      - "game_source/src/engine/rivals.ts"
      - "game_source/src/engine/state.ts"
      - "game_source/src/engine/__tests__/rivalPoster*.test.ts"
      - "game_source/public/rival-posters/**"
      - "game_source/scripts/sharedPosterExpansionPlan.mjs"
      - "game_source/package*.json"
      - ".github/workflows/poster-expansion-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game_source

    steps:
      - name: Checkout poster expansion branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate expansion plan and report coverage
        run: node scripts/sharedPosterExpansionPlan.mjs

      - name: Poster-focused tests
        run: npx vitest run src/engine/__tests__/rivalPosterManifest.test.ts src/engine/__tests__/rivalPosters.test.ts src/engine/__tests__/rivals.test.ts --reporter=dot

      - name: Full test suite
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build
