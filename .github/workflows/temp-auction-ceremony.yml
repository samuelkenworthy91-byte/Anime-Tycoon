            const bid=(inc:number)=>setRun(r=>{const out=placeLivePlayerBid(r.ipMarket,auction.id,auction.currentBid+inc,r.cash,r.week,r.rivalWorld);if(!out)return r;sfx.select();if(out.cashDelta<0)sfx.fanfare(true);return {...r,cash:r.cash+out.cashDelta,ipMarket:out.market,notices:[...r.notices,out.notice]};});
