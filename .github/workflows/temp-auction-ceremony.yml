 text-gold sm:text-6xl">{formatGBPShort(auction.currentBid)}</div><div className="mt-2 text-xs text-paper/55">Leading: <b className={auction.leadingStudioId==="player"?"text-mint":"text-neon"}>{leader}</b></div>{auction.resolved?<div className="mt-5"><Trophy className="mx-auto text-gold" size={34}/><div className="mt-2 text-[10px] font-black tracking-[.45em] text-gold">SOLD</div><div className="mt-1 text-2xl font-black">{winner}</div>{auction.winnerId==="player"&&<div className="mx-auto mt-3 max-w-md rounded border border-viol/35 bg-viol/10 p-2 text-[10px] text-paper/60">The property’s hidden arc remains secret. Deliver a 24/40+ adaptation to master it permanently for originals and other licensed productions.</div>}<Btn big variant="gold" className="mt-5" onClick={onDone}>RETURN TO STUDIO</Btn></div>:<><div className="mt-5 grid grid-cols-2 gap-2 sm:grid-cols-4">{increments.map((inc,i)=><Btn key={inc} variant="gold" disabled={run.cash<auction.currentBid+inc} onClick={()=>bid(inc)}>+{[5,10,25,50][i]}%<span className="ml-1 text-[8px] opacity-65">{formatGBPShort(inc)}</span></Btn>)}</div><div className="mt-3 text-[9px] text-paper/40">AI studios value genre fit, reputation and prestige. If nobody counters your bid, the hammer falls immediately.</div><div className="mt-4 flex flex-wrap justify-center gap-2"><Btn variant="ghost" onClick={onDone}>RETURN TO STUDIO</Btn><Btn variant="ghost" onClick={withdraw}><LogOut size={13}/>WITHDRAW</Btn></div></>}</div><div className="mt-3 rounded-xl border border-line/60 bg-black/35 p-3"><div className="text-[9px] font-black tracking-widest text-paper/45">BID HISTORY</div>{auction.bids.length===0?<div className="mt-2 text-xs text-paper/35">The room is waiting for the opening move.</div>:auction.bids.slice(-6).reverse().map((b,i)=><div key={`${b.studioId}-${b.amount}-${i}`} className="mt-1 flex justify-between text-xs"><span>{b.studioId==="player"?run.studio:run.rivalWorld.studios.find(s=>s.id===b.studioId)?.name??b.studioId}</span><b>{formatGBPShort(b.amount)}</b></div>)}</div></div></div></div></div>;
