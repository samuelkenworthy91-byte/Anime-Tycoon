          market_path=components/'IPMarket.tsx'; market=market_path.read_text(encoding='utf-8')
          market=market.replace('import { AUCTION_TYPE_LABEL, SOURCE_LABEL, appraiseAuction, genreLabel, ipById, negotiateRights, placePlayerBid } from "../engine/ip";','import { AUCTION_TYPE_LABEL, SOURCE_LABEL, appraiseAuction, genreLabel, ipById, negotiateRights } from "../engine/ip";')
          market=market.replace('export default function IPMarket({run,setRun,onAdapt}:{run:RunState;setRun:(fn:(r:RunState)=>RunState)=>void;onAdapt:(ipId:string)=>void}) {','export default function IPMarket({run,setRun,onAdapt,onEnterAuction}:{run:RunState;setRun:(fn:(r:RunState)=>RunState)=>void;onAdapt:(ipId:string)=>void;onEnterAuction:(auctionId:string)=>void}) {')
          market=re.sub(r'\n const bid=\(id:string,amount:number\)=>setRun\(r=>\{.*?\}\);','',market,count=1)
          market=market.replace('<b className="text-gold">RIGHTS MARKET</b> · Auctions tick weekly. Rivals value genre fit, reputation and studio tier. Hidden terms can be revealed through Data Lab appraisals; the Archive &amp; Research Room acts as the current Legal/Data capability.','<b className="text-gold">RIGHTS MARKET</b> · A rights opportunity has a random chance to appear and can fire at most once per 48-week industry year. Entering launches the live auction room; returned opportunities remain here until the end of the week.')
          # Replace old computed inline bid button with ceremony entry.
          market=re.sub(r'const inc=Math\.max\(10_000,Math\.round\(a\.currentBid\*\.08/5000\)\*5000\);const reveal=a\.appraisalLevel;', 'const reveal=a.appraisalLevel;', market)
          old='<Btn variant="gold" disabled={run.cash<a.currentBid+inc} onClick={()=>bid(a.id,a.currentBid+inc)}>BID {formatGBPShort(a.currentBid+inc)}</Btn>'
          if old not in market: raise SystemExit('IPMarket bid button marker missing')
          market=market.replace(old,'<Btn variant="gold" onClick={()=>onEnterAuction(a.id)}><Gavel size={12}/> ENTER AUCTION · {formatGBPShort(a.currentBid)}</Btn>')
          market_path.write_text(market,encoding='utf-8')

          # Office callback chain for reopening an auction after RETURN TO GAME.
          office_path=components/'Office.tsx'; office=office_path.read_text(encoding='utf-8')
          office=office.replace('  onLicensed,\n  onContract,','  onLicensed,\n  onAuction,\n  onContract,',1)
          office=office.replace('  onLicensed: (ipId: string) => void;\n  onContract:', '  onLicensed: (ipId: string) => void;\n  onAuction: (auctionId: string) => void;\n  onContract:',1)
          old='<IPMarket run={run} setRun={setRun} onAdapt={(ipId) => { setModal(null); onLicensed(ipId); }}/>'
          if old not in office: raise SystemExit('Office IPMarket marker missing')
          office=office.replace(old,'<IPMarket run={run} setRun={setRun} onAdapt={(ipId) => { setModal(null); onLicensed(ipId); }} onEnterAuction={(auctionId) => { setModal(null); onAuction(auctionId); }}/>')
          office_path.write_text(office,encoding='utf-8')

          # App: annual forecast alert pauses the clock, with skip/return/enter choices; auction is a full screen like awards.
          app_path=src/'App.tsx'; app=app_path.read_text(encoding='utf-8')
          app=app.replace('import LicensedCreate from "./components/LicensedCreate";','import LicensedCreate from "./components/LicensedCreate";\nimport AuctionForecast from "./components/AuctionForecast";\nimport AuctionCeremony from "./components/AuctionCeremony";')
          app=app.replace('type Screen = "title" | "office" | "create" | "licensed" | "produce" | "ship" | "contract" | "release" | "gameover" | "retrospective" | "awards";','type Screen = "title" | "office" | "create" | "licensed" | "produce" | "ship" | "contract" | "release" | "gameover" | "retrospective" | "awards" | "auction";')
          app=app.replace('  const [licensedIpId, setLicensedIpId] = useState<string | null>(null);','  const [licensedIpId, setLicensedIpId] = useState<string | null>(null);\n  const [auctionId, setAuctionId] = useState<string | null>(null);')
          awards_marker='  /* ------------------------------------------------------- game clock */'
          auction_effect='''  /* ------------------------------------ annual rights forecast: like other attention events,\n     the live clock stops and the player explicitly decides whether to engage. */\n  const seenAuctionPrompt = useRef<string | null>(null);\n  useEffect(() => {\n    const id = run?.ipMarket.pendingPromptId ?? null;\n    if (!id || id === seenAuctionPrompt.current) return;\n    if (screen === "office" || screen === "produce") {\n      seenAuctionPrompt.current = id;\n      setTimeSpeed(0);\n      sfx.fanfare();\n    }\n  }, [run?.ipMarket.pendingPromptId, screen]);\n\n'''
          if awards_marker not in app: raise SystemExit('App game clock marker missing')
          app=app.replace(awards_marker,auction_effect+awards_marker,1)
          licensed_marker='  const licensedShow = useCallback((ipId: string) => {\n    sfx.select(); setContPlan(null); setPendingCommission(null); setLicensedIpId(ipId); setScreen("licensed");\n  }, []);'
          if licensed_marker not in app: raise SystemExit('licensedShow marker missing')
          app=app.replace(licensed_marker,licensed_marker+'\n\n  const enterAuction = useCallback((id: string) => {\n    sfx.select(); setAuctionId(id); setTimeSpeed(0); setScreen("auction");\n  }, []);')
          app=app.replace('            onLicensed={licensedShow}\n            onContract=', '            onLicensed={licensedShow}\n            onAuction={enterAuction}\n            onContract=',1)
          render_marker='        {screen === "awards" && run?.awardsCeremony && ('
          if render_marker not in app: raise SystemExit('Awards render marker missing')
          auction_render='''        {run && run.ipMarket.pendingPromptId && (screen === "office" || screen === "produce") && (\n          <AuctionForecast run={run} setRun={(fn) => setRun((r) => (r ? fn(r) : r))} onEnter={enterAuction} />\n        )}\n        {screen === "auction" && run && auctionId && (\n          <AuctionCeremony run={run} setRun={(fn) => setRun((r) => (r ? fn(r) : r))} auctionId={auctionId} onDone={() => { setAuctionId(null); setScreen("office"); }} />\n        )}\n'''
          app=app.replace(render_marker,auction_render+render_marker,1)
          app_path.write_text(app,encoding='utf-8')

          # Engine tests: 100 live IPs, unique hidden arcs, annual cadence, prompt semantics, four bid choices.
          test = r'''import { describe, expect, it } from "vitest";
          import { ARCS } from "../data";
          import { AUCTION_IPS, bidIncrementOptions, dismissAuctionPrompt, initIPMarket, scheduleNextAuctionWeek, tickIPMarket } from "../ip";
          import { initRivalWorld } from "../rivals";

          describe("annual live IP auctions", () => {
            it("uses the full 100-property user catalogue and gives every IP one unique hidden studio arc", () => {
              expect(AUCTION_IPS).toHaveLength(100);
              const ids=AUCTION_IPS.map(ip=>ip.specialArcUnlock);
              expect(ids.every(Boolean)).toBe(true);
              expect(new Set(ids).size).toBe(100);
              for(const id of ids){const a=ARCS.find(x=>x.id===id);expect(a?.unlock).toEqual({kind:"studioArc"});expect(a?.syn?.length).toBeGreaterThanOrEqual(2);}
            });
            it("schedules no more than one candidate inside a 48-week year and can skip years", () => {
              const seq=[0.2,0.5]; let i=0; const week=scheduleNextAuctionWeek(0,()=>seq[i++]??0.5); expect(week).toBeGreaterThanOrEqual(6); expect(week).toBeLessThanOrEqual(42);
              const skip=[0.99,0.2,0.0]; i=0; const later=scheduleNextAuctionWeek(0,()=>skip[i++]??0); expect(later).toBeGreaterThanOrEqual(48+6);
            });
            it("creates a one-week prompted opportunity and schedules the following opportunity no earlier than next industry year", () => {
              const base=initIPMarket(0,()=>0); const m={...base,nextAuctionWeek:10}; const world=initRivalWorld();
              const out=tickIPMarket(m,{week:10,cash:1_000_000,fans:0,awards:0,bestScore:0,showsMade:0},world,()=>0);
              const live=out.market.auctions.find(a=>!a.resolved); expect(live).toBeTruthy(); expect(live?.closesWeek).toBe(11); expect(out.market.pendingPromptId).toBe(live?.id); expect(out.market.nextAuctionWeek).toBeGreaterThanOrEqual(48+6);
              expect(dismissAuctionPrompt(out.market,live!.id).pendingPromptId).toBeNull();
            });
            it("offers four escalating live bid increments",()=>{const x=bidIncrementOptions(200_000);expect(x).toHaveLength(4);expect(x[0]).toBeLessThan(x[1]);expect(x[1]).toBeLessThan(x[2]);expect(x[2]).toBeLessThan(x[3]);});
          });
          '''
          test='\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()).strip()+"\n"
          (engine/'__tests__'/'annual-auction-hidden-arcs.test.ts').write_text(test,encoding='utf-8')

          # Documentation of the actual implemented flow.
          (docs/'ANNUAL_LIVE_AUCTION_FLOW.md').write_text('''# Annual Live IP Auction Flow\n\n- Auction opportunities are rare event rolls: at most one candidate can fire in each 48-week industry year, and some years have no auction.\n- A fired opportunity pauses the live clock and opens the full-screen forecast alert.\n- **Skip Auction** declines participation and resolves the room to AI. **Return to Game** hides the alert but keeps the auction available in Rights Market until the end of the current week. **Enter Auction** opens the theatrical stage.\n- The stage deliberately reuses the awards visual language: stage background, red curtains, valance, gold presentation and poster focus.\n- Four bid controls raise the current price by approximately **5% / 10% / 25% / 50%** (rounded to the economy's £5k increments, minimum £10k). AI studios counter instantly based on reputation, tier and genre fit. If no AI studio is willing to beat the player's offer, the hammer falls immediately.\n- Each of the 100 user catalogue IPs owns exactly one hidden studio blueprint. A 24/40+ licensed adaptation discovers it. Once discovered, the arc is available to original productions and as an optional blueprint on other licensed adaptations.\n- Every hidden arc strongly synergises with its source property's two canonical genres and has a discoverable combo with an existing standard arc; each also has a situational anti-fit so it is not a flat universal upgrade.\n''',encoding='utf-8')
          PY
      - name: Install, test and build
        working-directory: game_source
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-auction-ceremony.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement annual live IP auction ceremonies"
          git push origin HEAD:work/auction-ceremony-hidden-arcs
