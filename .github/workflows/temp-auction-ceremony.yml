5 p-2 text-[10px] text-paper/55"><b className="text-viol">UNKNOWN STORY BLUEPRINT</b> · a strong adaptation can permanently teach your studio this property’s hidden arc.</div></div></div><div className="mt-4 grid gap-2 sm:grid-cols-3"><Btn variant="ghost" onClick={skip}><SkipForward size={14}/>SKIP AUCTION</Btn><Btn variant="ghost" onClick={close}><X size={14}/>RETURN TO GAME</Btn><Btn big variant="gold" onClick={enter}><Gavel size={17}/>ENTER AUCTION</Btn></div></div></div>;
