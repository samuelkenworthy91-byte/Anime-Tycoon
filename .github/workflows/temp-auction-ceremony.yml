ze={10} className="mr-1 inline"/>}<b>{a.name}</b>{a.requiresSequelRights&&<span className="ml-2 text-[9px] text-paper/45">sequel rights</span>}</button>})}</div>{learnedBlueprints.length>0&&<div className="ink-card p-3"><div className="text-[10px] font-black tracking-widest text-viol"><Sparkles size={11} className="mr-1 inline"/>STUDIO BLUEPRINT</div><div className="mt-1 text-[9px] text-paper/45">Optional: use a hidden arc learned from another licensed property.</div><button onClick={()=>setStudioArcId("")} className={cn("mt-2 rounded border px-2 py-1 text-[9px]",!studioArcId?"border-viol text-viol":"border-line")}>DEFAULT HOOK</button><div className="mt-2 grid gap-1 sm:grid-cols-2">{learnedBlueprints.map(a=><button key={a.id} onClick={()=>setStudioArcId(a.id)} className={cn("rounded border p-2 text-left text-[10px]",studioArcId===a.id?"border-viol bg-viol/10":"border-line")}><b>{a.name}</b><div className="mt-0.5 text-[8px] text-paper/40">{a.desc}</div></button>)}</div></div>}<div className="ink-card p-3"><div className="text-[10px] font-black tracking-widest text-gold">FORMAT · BUDGET · SCOPE</div><div className="mt-2 flex flex-wrap gap-1">{(Object.keys(MEDIUMS) as MediumId[]).filter(m=>run.mediumsUnlocked.includes(m)).map(m=><button key={m} onClick={()=>{setMedium(m);if(!mediumAllowsScope(m,scope))setScope("standard")}} className={cn("rounded border px-2 py-1 text-[10px]",medium===m?"border-cyanx text-cyanx":"border-line")}>{MEDIUMS[m].label}</button>)}</div><div className="mt-2 flex gap-1">{(Object.keys(BUDGETS) as BudgetId[]).map(b=><button key={b} onClick={()=>setBudget(b)} className={cn("flex-1 rounded border p-2 text-[10px]",budget===b?"border-gold text-gold":"border-line")}>{BUDGETS[b].label}<br/>{formatGBP(BUDGETS[b].cost)}</button>)}</div><div className="mt-2 flex gap-1">{(Object.keys(PRODUCTION_SCOPES) as ScopeId[]).filter(s=>mediumAllowsScope(medium,s)).map(s=><button key={s} onClick={()=>setScope(s)} className={cn("flex-1 rounded border p-1 text-[9px]",