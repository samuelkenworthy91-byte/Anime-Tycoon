name: Validate first-seen tutorial overlays

on:
  push:
    branches:
      - work/first-seen-tutorial-overlays
    paths:
      - ".github/workflows/first-seen-tutorial-overlays.yml"

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/first-seen-tutorial-overlays
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Wire tutorials into complex studio systems
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('game_source/src/components/StudioExpansionPanel.tsx')
          s = p.read_text()
          s = s.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";', 1)
          anchor = 'import { StaffStoryInbox } from "./StaffCultureProfile";\n'
          insert = anchor + 'import FirstSeenTutorial, { TutorialHelpButton } from "./FirstSeenTutorial";\nimport { markTutorialSeen, tutorialSeen, type TutorialId } from "../engine/tutorials";\n'
          if 'FirstSeenTutorial' not in s:
              if anchor not in s: raise SystemExit('tutorial import anchor missing')
              s = s.replace(anchor, insert, 1)

          old = '''export default function StudioExpansionPanel(props: Props) {
  const [tab, setTab] = useState<"staff" | "policies" | "overseas">("staff");
  return (
    <div className="space-y-4 text-sm">
      <div
        className="flex flex-wrap gap-2"
        aria-label="Studio expansion sections"
      >
        {(["staff", "policies", "overseas"] as const).map((t) => (
          <button
            key={t}
            className={button + (t === tab ? " text-gold" : "")}
            aria-pressed={t === tab}
            onClick={() => setTab(t)}
          >
            {t === "staff"
              ? "AMBITIONS"
              : t === "policies"
                ? "WORKING POLICIES"
                : "OVERSEAS MARKETS"}
          </button>
        ))}
      </div>
      {tab === "staff" ? (
        <StaffAmbitions {...props} />
      ) : tab === "policies" ? (
        <PolicyPanel {...props} />
      ) : (
        <OverseasPanel {...props} />
      )}
    </div>
  );
}
'''
          new = '''export default function StudioExpansionPanel(props: Props) {
  const { run, setRun } = props;
  const [tab, setTab] = useState<"staff" | "policies" | "overseas">("staff");
  const [tutorial, setTutorial] = useState<TutorialId | null>(null);
  const expansion = expansionOf(run);
  const hasCreatorCommitment =
    expansion.pitches.some((p) => !["declined", "accepted"].includes(p.status)) ||
    expansion.promises.some((p) => p.status === "active");
  const tabTutorial: TutorialId =
    tab === "staff" ? "passion-projects" :
    tab === "policies" ? "working-policies" : "overseas-markets";

  useEffect(() => {
    if (tab === "staff" && !hasCreatorCommitment) return;
    if (!tutorialSeen(run, tabTutorial)) setTutorial(tabTutorial);
  }, [tab, tabTutorial, hasCreatorCommitment, run.tutorialsSeen]);

  const dismissTutorial = () => {
    if (tutorial) setRun((r) => markTutorialSeen(r, tutorial));
    setTutorial(null);
  };

  return (
    <div className="space-y-4 text-sm">
      <div className="flex items-start justify-between gap-2">
        <div
          className="flex flex-1 flex-wrap gap-2"
          aria-label="Studio expansion sections"
        >
          {(["staff", "policies", "overseas"] as const).map((t) => (
            <button
              key={t}
              className={button + (t === tab ? " text-gold" : "")}
              aria-pressed={t === tab}
              onClick={() => setTab(t)}
            >
              {t === "staff"
                ? "AMBITIONS"
                : t === "policies"
                  ? "WORKING POLICIES"
                  : "OVERSEAS MARKETS"}
            </button>
          ))}
        </div>
        <TutorialHelpButton onClick={() => setTutorial(tabTutorial)} />
      </div>
      {tab === "staff" ? (
        <StaffAmbitions {...props} />
      ) : tab === "policies" ? (
        <PolicyPanel {...props} />
      ) : (
        <OverseasPanel {...props} />
      )}
      <FirstSeenTutorial id={tutorial ?? tabTutorial} open={tutorial !== null} onDismiss={dismissTutorial} />
    </div>
  );
}
'''
          if old not in s: raise SystemExit('StudioExpansionPanel component anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          audit = Path('game_source/docs/THREE_CLICK_UX_AUDIT.md')
          a = audit.read_text()
          marker = '## Proposed implementation order\n'
          rule = '''## First-seen tutorial fallback\n\nIf a routine system still legitimately takes more than three navigation/action clicks after streamlining, its first real encounter must open a short player-facing tutorial. The tutorial must: use visual screen previews of the actual controls, show no more than three numbered steps, explain the consequence of the final action, appear only once per save, and remain replayable from a **HOW THIS WORKS** button on that page. Tutorials support complexity; they do not excuse avoidable menu depth.\n\nThe first covered systems are Passion Projects, Working Policies and Overseas Markets, because the current audit identifies those as the clearest 4+ click flows.\n\n'''
          if rule not in a:
              if marker not in a: raise SystemExit('audit insertion anchor missing')
              a = a.replace(marker, rule + marker, 1)
          audit.write_text(a)
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run full tests
        working-directory: game_source
        run: npm test

      - name: Build browser app
        working-directory: game_source
        run: npm run build

      - name: Commit validated tutorial system
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/first-seen-tutorial-overlays.yml
          git add game_source/src/components/StudioExpansionPanel.tsx game_source/docs/THREE_CLICK_UX_AUDIT.md game_source/dist
          git commit -m 'Add first-seen tutorials for complex systems'
          git push origin HEAD:work/first-seen-tutorial-overlays
