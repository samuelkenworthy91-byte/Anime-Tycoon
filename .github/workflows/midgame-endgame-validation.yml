name: Midgame Endgame Systems Validation

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
      - work/zeitgeist-commercial-events-pass
      - depth-clarity-overhaul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run awards capacity simulation
        working-directory: game_source
        run: npx vitest run scripts/award-craft-capacity-sim.test.ts --reporter=verbose
      - name: Run Stage 8 progression audit
        working-directory: game_source
        run: npx vitest run scripts/stage8-progression-audit.test.ts --reporter=verbose
      - name: Run focused awards and IP tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/award-nominations.test.ts src/engine/__tests__/award-expectations.test.ts src/engine/__tests__/ip-renewal.test.ts --reporter=verbose
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Build production web app
        working-directory: game_source
        run: npm run build
