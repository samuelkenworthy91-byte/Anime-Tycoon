name: Premiere Reveal CI

on:
  push:
    branches:
      - feature/deeper-studio-loop
    paths:
      - ".github/workflows/premiere-reveal-ci.yml"

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deeper-studio-loop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Test
        working-directory: game_source
        run: npm test
      - name: Build
        working-directory: game_source
        run: npm run build
      - name: Commit GitHack build
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add -f game_source/dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh browser build for premiere reveal"
          git push origin HEAD:feature/deeper-studio-loop
