name: Finalize Showrunner Art and Abilities

on:
  push:
    branches:
      - work/research-showrunner-auction-depth-pass
    paths:
      - .github/workflows/finalize-showrunner-abilities.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/research-showrunner-auction-depth-pass
          fetch-depth: 0

      - name: Validate committed showrunner assets
        shell: bash
        run: |
          set -euo pipefail
          for id in hype contrarian savant trailblazer; do
            test -s "game_source/public/img/portrait-showrunner-${id}.webp"
            test -s "game_source/public/img/sprite-showrunner-${id}.webp"
            file "game_source/public/img/portrait-showrunner-${id}.webp" | grep -qi webp
            file "game_source/public/img/sprite-showrunner-${id}.webp" | grep -qi webp
          done

      - name: Patch agreed abilities and scoped showrunner roster
        shell: bash
        run: |
          set -euo pipefail
          python3 game_source/scripts/finalize-showrunner-abilities.py

          # The legacy stable ids also occur elsewhere in data.ts. Restore the
          # checked-in catalog, then replace ONLY rows inside SHOWRUNNERS.
          git checkout -- game_source/src/engine/data.ts
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("game_source/src/engine/data.ts")
          text = p.read_text(encoding="utf-8")
          marker = "export const SHOWRUNNERS: Showrunner[] = ["
          start = text.index(marker)
          end = text.index("\n];", start) + len("\n];")
          block = text[start:end]

          rows = {
              "casting": '  { id: "casting", name: "Ren Mercer", title: "The Hype Architect", img: "img/portrait-showrunner-hype.webp", sprite: "img/sprite-showrunner-hype.webp", portrait: "img/portrait-showrunner-hype.webp", perk: "Narrative Momentum — positive story structures are 15% stronger; release fan gains ×1.25, rising to ×1.50 when Story leads a coherent release." },',
              "festival": '  { id: "festival", name: "Soren Berg", title: "The Contrarian", img: "img/portrait-showrunner-contrarian.webp", sprite: "img/sprite-showrunner-contrarian.webp", portrait: "img/portrait-showrunner-contrarian.webp", perk: "Against the Grain — experimental genre pairings have 60% stronger synergy, turning strange concepts into a genuine studio strategy." },',
              "dealmaker": '  { id: "dealmaker", name: "Mina Arata", title: "The Production Savant", img: "img/portrait-showrunner-savant.webp", sprite: "img/sprite-showrunner-savant.webp", portrait: "img/portrait-showrunner-savant.webp", perk: "Engineer’s Eye — every show and licensed IP reveals a 20-point likely ideal range for each direction slider, even on an unseen blend." },',
              "genre": '  { id: "genre", name: "Roxie Kade", title: "The Trailblazer", img: "img/portrait-showrunner-trailblazer.webp", sprite: "img/sprite-showrunner-trailblazer.webp", portrait: "img/portrait-showrunner-trailblazer.webp", perk: "No Blueprint — a two-genre combination your studio has never shipped gets +35% production output throughout its first production." },',
          }

          for sid, row in rows.items():
              pattern = rf'^  \{{ id: "{sid}"[^\n]*$'
              block, count = re.subn(pattern, row, block, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Expected exactly one SHOWRUNNERS row for {sid}; got {count}")

          if "artPending: true" in block:
              raise SystemExit("SHOWRUNNERS still contains artPending placeholder flags")

          p.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Focused showrunner tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/showrunner-abilities.test.ts --reporter=verbose

      - name: Full test suite
        working-directory: game_source
        run: npm test

      - name: Production build
        working-directory: game_source
        run: npm run build

      - name: Reject stale placeholder mechanics
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'showrunner === "casting" ? 1.25' game_source/src
          ! grep -R 'showrunner === "festival" ?' game_source/src
          ! grep -R 'showrunner === "dealmaker" ? 1.14' game_source/src
          ! grep -R 'showrunner === "genre".*comboFactor' game_source/src
          ! grep -R 'artPending: true' game_source/src/engine/data.ts
          grep -q 'title: "The Hype Architect"' game_source/src/engine/data.ts
          grep -q 'title: "The Contrarian"' game_source/src/engine/data.ts
          grep -q 'title: "The Production Savant"' game_source/src/engine/data.ts
          grep -q 'title: "The Trailblazer"' game_source/src/engine/data.ts

      - name: Commit validated final state and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf game_source/.tmp_showrunner_art
          rm -f game_source/scripts/finalize-showrunner-abilities.py
          rm -f game_source/scripts/finalize-showrunner-art.mjs
          rm -f .github/workflows/finalize-showrunner-abilities.yml
          git add -A
          git diff --cached --stat
          git commit -m "Finalize four new showrunners and abilities [skip ci]"
          git push origin HEAD:work/research-showrunner-auction-depth-pass
