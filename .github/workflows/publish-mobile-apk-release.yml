name: Publish Mobile APK Release

on:
  push:
    paths:
      - ".github/workflows/publish-mobile-apk-release.yml"

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Build Android debug APK
        working-directory: game_source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release APK
        run: cp game_source/android/app/build/outputs/apk/debug/app-debug.apk AnimeRunner-Final.apk

      - name: Publish direct GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='anime-runner-final'
          APK='AnimeRunner-Final.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner Final Playtest' \
            --notes 'Search-enabled Anime Runner Android playtest built from current main after the full automated test suite and Capacitor sync passed.'
