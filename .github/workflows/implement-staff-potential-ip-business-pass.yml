name: Staff Potential and IP Business Pass

on:
  push:
    branches:
      - work/staff-potential-ip-business-pass
    paths:
      - game_source/scripts/implement-staff-potential-ip-business-pass.mjs
      - .github/workflows/implement-staff-potential-ip-business-pass.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/staff-potential-ip-business-pass
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Repair generated literals in harness
        working-directory: game_source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/implement-staff-potential-ip-business-pass.mjs')
          s = p.read_text()
          replacements = [
            ('<span className={`min-w-12 text-right font-display text-xl font-black ${record.gains[point] > 0 ? "text-mint" : "text-paper/30"}`}>+{record.gains[point]}</span>',
             '<span className={record.gains[point] > 0 ? "min-w-12 text-right font-display text-xl font-black text-mint" : "min-w-12 text-right font-display text-xl font-black text-paper/30"}>+{record.gains[point]}</span>'),
            ('if(fr.soldTo)return `Already sold to ${"${fr.soldTo.name}"}`;',
             'if(fr.soldTo)return \\`Already sold to ${"${fr.soldTo.name}"}\\`;'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected harness literal not found: {old[:60]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Apply implementation pass
        working-directory: game_source
        run: node scripts/implement-staff-potential-ip-business-pass.mjs

      - name: Repair generated Crew footer
        working-directory: game_source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Crew.tsx')
          s = p.read_text()
          old = 'onClose={() => setCandidate(null)} />}\n'
          if old not in s:
              raise SystemExit('Generated CandidateSheet trailing brace not found')
          p.write_text(s.replace(old, 'onClose={() => setCandidate(null)} />\n', 1))
          PY

      - name: Update legacy fixed-growth assertions
        working-directory: game_source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine/__tests__/staff-999.test.ts')
          s = p.read_text()
          old = '''    expect(out.staff.story).toBe(101);\n    expect(out.staff.art).toBe(100);\n    expect(out.staff.sound).toBe(100);'''
          new = '''    expect(out.staff.story + out.staff.art + out.staff.sound).toBeGreaterThan(297);\n    expect(out.staff.pendingLevelUps).toHaveLength(1);\n    expect(out.staff.pendingLevelUps![0].afterLevel).toBe(13);'''
          if old not in s: raise SystemExit('staff-999 fixed-growth assertion not found')
          s = s.replace(old, new)
          old2 = '''    expect(migrated.story).toBe(107);\n    expect(migrated.art).toBe(103);\n    expect(migrated.sound).toBe(103);'''
          new2 = '''    expect(migrated.story + migrated.art + migrated.sound).toBeGreaterThan(297);\n    expect(migrated.potential).toBeGreaterThanOrEqual(1);\n    expect(migrated.potential).toBeLessThanOrEqual(100);'''
          if old2 not in s: raise SystemExit('staff-999 migration assertion not found')
          p.write_text(s.replace(old2, new2))

          p = Path('src/engine/__tests__/intensive-development.test.ts')
          s = p.read_text()
          s = s.replace('it("stat growth comes from gainXp: +2 main / +1 off per level", () => {', 'it("stat growth comes from the same potential-driven gainXp roll", () => {')
          old = '''    /* writer: +2 story, +1 art, +1 sound — the canonical growth */\n    expect(after.story - before.story).toBe(2);\n    expect(after.art - before.art).toBe(1);\n    expect(after.sound - before.sound).toBe(1);'''
          new = '''    expect((after.story-before.story)+(after.art-before.art)+(after.sound-before.sound)).toBeGreaterThanOrEqual(0);\n    expect(after.pendingLevelUps).toHaveLength(1);'''
          if old not in s: raise SystemExit('intensive fixed-growth assertion not found')
          p.write_text(s.replace(old, new))

          p = Path('src/engine/__tests__/careers.test.ts')
          s = p.read_text()
          old = '''    expect(g.staff.story).toBe(52); // main stat +2\n    expect(g.staff.art).toBe(51);'''
          new = '''    const gain = g.staff.pendingLevelUps![0].gains;\n    expect(g.staff.story).toBe(50 + gain.story);\n    expect(g.staff.art).toBe(50 + gain.art);\n    expect(g.staff.sound).toBe(50 + gain.sound);\n    expect(gain.story + gain.art + gain.sound).toBeGreaterThanOrEqual(0);\n    expect(g.staff.pendingLevelUps).toHaveLength(1);'''
          if old not in s: raise SystemExit('careers fixed-growth assertion not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Run focused tests
        working-directory: game_source
        run: npm test -- src/engine/__tests__/staff-potential-business.test.ts src/engine/__tests__/careers.test.ts src/engine/__tests__/staff-999.test.ts src/engine/__tests__/intensive-development.test.ts src/engine/__tests__/arc-discovery.test.ts src/engine/__tests__/annual-auction-hidden-arcs.test.ts

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build production app
        working-directory: game_source
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src game_source/scripts/implement-staff-potential-ip-business-pass.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Implement staff potential and IP business pass"
            git push origin HEAD:work/staff-potential-ip-business-pass
          fi
