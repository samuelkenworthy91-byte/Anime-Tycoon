name: Staff Potential and IP Business Pass

on:
  push:
    branches:
      - work/staff-potential-ip-business-pass
    paths:
      - game_source/scripts/implement-staff-potential-ip-business-pass.mjs
      - .github/workflows/implement-staff-potential-ip-business-pass.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/staff-potential-ip-business-pass
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Repair generated TSX literal in harness
        working-directory: game_source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/implement-staff-potential-ip-business-pass.mjs')
          s = p.read_text()
          old = '<span className={`min-w-12 text-right font-display text-xl font-black ${record.gains[point] > 0 ? "text-mint" : "text-paper/30"}`}>+{record.gains[point]}</span>'
          new = '<span className={record.gains[point] > 0 ? "min-w-12 text-right font-display text-xl font-black text-mint" : "min-w-12 text-right font-display text-xl font-black text-paper/30"}>+{record.gains[point]}</span>'
          if old not in s:
              raise SystemExit('Expected nested TSX template literal not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Apply implementation pass
        working-directory: game_source
        run: node scripts/implement-staff-potential-ip-business-pass.mjs

      - name: Run focused tests
        working-directory: game_source
        run: npm test -- src/engine/__tests__/staff-potential-business.test.ts src/engine/__tests__/careers.test.ts src/engine/__tests__/staff-999.test.ts src/engine/__tests__/intensive-development.test.ts src/engine/__tests__/arc-discovery.test.ts src/engine/__tests__/annual-auction-hidden-arcs.test.ts

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build production app
        working-directory: game_source
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src game_source/scripts/implement-staff-potential-ip-business-pass.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Implement staff potential and IP business pass"
            git push origin HEAD:work/staff-potential-ip-business-pass
          fi
