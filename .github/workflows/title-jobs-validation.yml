name: Validate title and jobs QoL pass

on:
  push:
    branches:
      - work/qol-playtest-sept16
    paths:
      - ".github/workflows/title-jobs-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qol-playtest-sept16
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply title/jobs source wiring
        run: node game_source/scripts/apply-title-jobs-pass.mjs
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit validated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src
          git commit -m "Expand anime titles and restore job Quick Pick"
          git push
