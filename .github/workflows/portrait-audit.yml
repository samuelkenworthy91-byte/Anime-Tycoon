name: Apply Production Floor Fix

on:
  push:
    branches:
      - fix/portrait-framing-editing-loop
    paths:
      - ".github/workflows/portrait-audit.yml"

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/portrait-framing-editing-loop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          cd game_source
          npm ci

      - name: Apply fixes
        run: python tools/apply_floor_fix.py

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Build web app
        working-directory: game_source
        run: npm run build

      - name: Commit validated fixes
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/components/ProductionFloor.tsx game_source/src/components/Produce.tsx game_source/src/components/ContractJob.tsx game_source/src/components/Title.tsx game_source/src/App.tsx game_source/README.md game_source/public/img/cast-ready/villain/v_ash__warlord-ash.webp
          git commit -m "Make production floor staff-driven and fix portrait framing"
          git push origin HEAD:fix/portrait-framing-editing-loop
