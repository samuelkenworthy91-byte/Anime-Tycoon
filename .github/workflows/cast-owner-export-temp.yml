name: Temporary cast owner export

on:
  push:
    branches:
      - analysis/cast-owner-export-20260917

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Export live Casting Catalog V7 owners
        working-directory: game_source
        run: |
          cat > src/engine/__tests__/cast-owner-export-temp.test.ts <<'EOF'
          import { expect, it } from "vitest";
          import { writeFileSync } from "node:fs";
          import { CAST_V2 } from "../castV2";
          import { SECRET_COMBOS } from "../data";
          import { castingCatalogMeta } from "../castCatalog";

          it("exports every experimental pair owner", () => {
            const secretKeys = new Set(Object.keys(SECRET_COMBOS));
            const roleOrder: Record<string, number> = { protag: 0, secondary: 1, pet: 2, villain: 3 };
            const typeOrder: Record<string, number> = { shonen: 0, shojo: 1 };
            const rows: Array<Record<string, unknown>> = [];
            for (const member of CAST_V2) {
              const meta = castingCatalogMeta(member);
              if (!meta?.active) continue;
              for (const key of meta.pairKeys) {
                if (!secretKeys.has(key)) continue;
                rows.push({
                  key,
                  role: member.role,
                  type: member.type,
                  id: member.id,
                  name: member.name,
                  img: member.img,
                  visible: member.visibleAff,
                  hidden: meta.secretGenre,
                  kind: meta.kind,
                });
              }
            }
            rows.sort((a, b) =>
              String(a.key).localeCompare(String(b.key)) ||
              (typeOrder[String(a.type)] ?? 9) - (typeOrder[String(b.type)] ?? 9) ||
              (roleOrder[String(a.role)] ?? 9) - (roleOrder[String(b.role)] ?? 9)
            );
            writeFileSync("cast-owner-export.json", JSON.stringify(rows, null, 2));
            expect(rows).toHaveLength(secretKeys.size * 8);
          });
          EOF
          npx vitest run src/engine/__tests__/cast-owner-export-temp.test.ts --reporter=verbose
      - name: Collect owner portraits
        working-directory: game_source
        run: |
          mkdir -p cast-owner-images
          node <<'NODE' > /tmp/cast-owner-images.tsv
          const rows = require('./cast-owner-export.json');
          const seen = new Set();
          for (const row of rows) {
            if (seen.has(row.id)) continue;
            seen.add(row.id);
            console.log(`${row.id}\t${row.img}`);
          }
          NODE
          missing=0
          while IFS=$'\t' read -r id img; do
            src=""
            for candidate in "public/img/$img" "public/$img" "src/assets/$img"; do
              if [ -f "$candidate" ]; then src="$candidate"; break; fi
            done
            if [ -z "$src" ]; then
              src=$(find . -type f -path "*/$img" -print -quit)
            fi
            if [ -z "$src" ]; then
              echo "MISSING $id $img"
              missing=$((missing+1))
              continue
            fi
            ext="${src##*.}"
            cp "$src" "cast-owner-images/$id.$ext"
          done < /tmp/cast-owner-images.tsv
          echo "Unique portraits: $(find cast-owner-images -type f | wc -l)"
          echo "Missing portraits: $missing"
          test "$missing" -eq 0
      - name: Upload owner map and portraits
        uses: actions/upload-artifact@v4
        with:
          name: cast-owner-export-with-images
          path: |
            game_source/cast-owner-export.json
            game_source/cast-owner-images
          retention-days: 1
