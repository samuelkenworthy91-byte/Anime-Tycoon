name: Temp integrate worker art and validate APK

on:
  push:
    branches: [work/integrate-worker-art-apk]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/integrate-worker-art-apk
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Integrate approved worker masters
        shell: bash
        run: |
          python -m pip install --quiet pillow
          # Repair the staging-script line break before execution.
          python - <<'PY'
          from pathlib import Path
          p=Path('game_source/scripts/temp_integrate_worker_art_24_27.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('test = test_path.read_text(encoding="utf-8")ntest = replace_once(', 'test = test_path.read_text(encoding="utf-8")\ntest = replace_once(')
          p.write_text(s, encoding='utf-8')
          PY
          python game_source/scripts/temp_integrate_worker_art_24_27.py

      - name: Full game validation
        working-directory: game_source
        run: |
          npm ci
          npm test
          npm run build

      - name: Android sync and debug build validation
        working-directory: game_source
        run: |
          npm run apk:sync
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload pre-merge APK proof
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-worker-art-premerge-apk
          path: game_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified integration
        shell: bash
        run: |
          rm -f game_source/scripts/temp_integrate_worker_art_24_27.py .github/workflows/temp-integrate-worker-art-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate four new worker art pairs"
          git pull --rebase origin work/integrate-worker-art-apk
          git push origin HEAD:work/integrate-worker-art-apk
