name: Validate tutorial QoL integration

on:
  push:
    branches:
      - work/tutorial-qol-integration-final
    paths:
      - ".github/workflows/tutorial-qol-integration.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tutorial-qol-integration-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply additive tutorial integration
        working-directory: game_source
        run: node scripts/apply-tutorial-qol-integration.mjs
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit validated source wiring
        run: |
          if git diff --quiet -- game_source/src; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src
          git commit -m "Integrate first-seen tutorials with QoL systems"
          git push
