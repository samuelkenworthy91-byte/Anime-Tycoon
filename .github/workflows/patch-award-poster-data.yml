name: Patch awards poster identity

on:
  push:
    branches:
      - work/final-awards-rival-posters
    paths:
      - .github/scripts/patch-award-poster-data.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/final-awards-rival-posters
          fetch-depth: 0

      - name: Patch awards poster identity
        run: node .github/scripts/patch-award-poster-data.mjs

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/src/engine/awards.ts game_source/src/engine/state.ts game_source/src/engine/__tests__/awards.test.ts
          if git diff --cached --quiet; then
            echo 'No patch change needed.'
          else
            git commit -m 'Preserve release poster identity for awards'
            git push origin HEAD:work/final-awards-rival-posters
          fi
