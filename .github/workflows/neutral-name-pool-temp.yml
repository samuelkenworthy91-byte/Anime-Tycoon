name: Add neutral name pool
on:
  push:
    branches: [fix/worker-gender-sprite-pass-2026-09-20]
    paths: [".github/workflows/neutral-name-pool-temp.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worker-gender-sprite-pass-2026-09-20
          fetch-depth: 0
      - name: Build neutral first-name pool
        run: |
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from collections import defaultdict
          base="https://github.com/onomaverse/datasets/releases/download/v2026.06/"
          def dl(name):
              with urllib.request.urlopen(base+name, timeout=90) as r:
                  return r.read().decode("utf-8-sig")
          given=list(csv.DictReader(io.StringIO(dl("given-name-frequency.csv"))))
          gender=list(csv.DictReader(io.StringIO(dl("name-gender-inference.csv"))))
          inference={}
          for row in gender:
              try:
                  inference[row["name_id"]] = (float(row["p_male"]), float(row["p_female"]))
              except Exception:
                  pass
          latin=re.compile(r"^[A-Za-zÀ-ÖØ-öø-ÿĀ-ž'’ -]+$")
          totals=defaultdict(int)
          names={}
          for row in given:
              name=(row.get("name") or "").strip()
              if not name or len(name)>30 or not latin.match(name): continue
              nid=row.get("name_id","")
              pm,pf=inference.get(nid,(1,0))
              if pm < .35 or pf < .35: continue
              try: count=int(row.get("count") or 0)
              except: count=0
              totals[nid]+=count
              names[nid]=name
          rows=sorted(((count,names[nid]) for nid,count in totals.items()), reverse=True)
          seen=set(); neutral=[]
          for _,name in rows:
              key=name.casefold()
              if key in seen: continue
              seen.add(key); neutral.append(name)
              if len(neutral)>=300: break
          if len(neutral)<100:
              raise SystemExit(f"Only {len(neutral)} neutral names found")
          path="game_source/src/engine/generated/internationalNames.json"
          data=json.load(open(path,encoding="utf-8"))
          data["neutralFirstNames"]=neutral
          data["neutralRule"]="Neutral worker looks use globally common Onomaverse names with both p_male and p_female >= 0.35."
          with open(path,"w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,separators=(",",":")); f.write("\n")
          print("Neutral names:",len(neutral),neutral[:30])
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/engine/generated/internationalNames.json
          git rm .github/workflows/neutral-name-pool-temp.yml
          git commit -m "Data: add neutral international first-name pool"
          git push origin HEAD:fix/worker-gender-sprite-pass-2026-09-20
