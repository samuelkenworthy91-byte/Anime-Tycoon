name: Temp staff depth verification

on:
  push:
    branches: [work/staff-depth-mastery]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/staff-depth-mastery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply staff depth patch
        run: |
          python game_source/scripts/temp_staff_depth_patch.py
          python game_source/scripts/temp_staff_depth_testfix.py
      - name: Full tests and production build
        working-directory: game_source
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f game_source/scripts/temp_staff_depth_patch.py game_source/scripts/temp_staff_depth_testfix.py .github/workflows/temp-staff-depth.yml
          git checkout -- game_source/docs/SCORING_BALANCE_MATRIX.json game_source/docs/SCORING_BALANCE_V2.md 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deepen staff traits genre mastery and showrunner stats"
          git pull --rebase origin work/staff-depth-mastery
          git push origin HEAD:work/staff-depth-mastery
