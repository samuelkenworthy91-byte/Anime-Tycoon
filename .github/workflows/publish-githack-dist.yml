name: Publish GitHack dist

on:
  push:
    branches:
      - work/first-seen-tutorial-overlays
    paths:
      - "game_source/src/**"
      - "game_source/public/**"
      - "game_source/scripts/**"
      - "game_source/docs/content-v3/**"
      - "game_source/docs/content-v5/**"
      - "game_source/docs/content-v6/**"
      - "game_source/art_src/cast_v6_genre30_upload_staging/**"
      - "game_source/package.json"
      - "game_source/package-lock.json"
      - "game_source/vite.config.*"
      - ".github/workflows/publish-githack-dist.yml"

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tutorial UX branch
        uses: actions/checkout@v4
        with:
          ref: work/first-seen-tutorial-overlays
          fetch-depth: 0

      - name: Apply quick contract assignment
        working-directory: game_source
        run: node scripts/patch-contract-quick-assign.mjs

      - name: Apply discovery-gated cast filtering
        working-directory: game_source
        run: node scripts/patch-cast-secret-visibility.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests and regenerate runtime
        working-directory: game_source
        run: npm test

      - name: Build browser dist
        working-directory: game_source
        run: npm run build

      - name: Verify compiled tutorial UX bundle
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          for (const marker of ['HOW THIS WORKS','YOUR STUDIO IS IN DEBT','RIGHTS MARKET & LICENSED ADAPTATIONS','HEAD VACANCY','QUICK BEST TEAM','CUSTOM TEAM']) {
            if (!html.includes(marker)) throw new Error(`Compiled browser bundle missing UX marker: ${marker}`);
          }
          console.log('Verified complete tutorial and quick-management UX bundle.');
          NODE

      - name: Commit validated quick-management integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/publish-githack-dist.yml
          git rm game_source/scripts/patch-contract-quick-assign.mjs
          git add -f \
            .github/workflows/publish-githack-dist.yml \
            game_source/src/components/Office.tsx \
            game_source/src/components/Projects.tsx \
            game_source/src/components/Create.tsx \
            game_source/src/engine/castDisplayOrder.ts \
            game_source/src/engine/__tests__/cast-display-filter.test.ts \
            game_source/src/engine/__tests__/cast-coverage.test.ts \
            game_source/src/engine/__tests__/cast-portrait-wiring-regression.test.ts \
            game_source/src/engine/generated/castV3.json \
            game_source/src/engine/generated/genreV3.json \
            game_source/src/engine/generated/arcV3.json \
            game_source/docs/content-v3/CAST_V3_TYPE_PAIR_COVERAGE.csv \
            game_source/dist
          git commit -m 'Add quick best-team contract assignment'
          git push origin HEAD:work/first-seen-tutorial-overlays
