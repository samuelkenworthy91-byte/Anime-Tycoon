name: Publish GitHack dist

on:
  push:
    branches:
      - main
      - depth-clarity-overhaul
    paths:
      - "game_source/src/**"
      - "game_source/public/**"
      - "game_source/scripts/**"
      - "game_source/docs/content-v3/**"
      - "game_source/docs/content-v5/**"
      - "game_source/docs/content-v6/**"
      - "game_source/art_src/cast_v6_genre30_upload_staging/**"
      - "game_source/package.json"
      - "game_source/package-lock.json"
      - "game_source/vite.config.*"
      - ".github/workflows/publish-githack-dist.yml"

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore approved London title artwork
        working-directory: game_source
        run: |
          if [ -d public/img/title-london-b64 ]; then
            echo 'Rebuilding approved London title artwork from committed chunks.'
            cat public/img/title-london-b64/{0..7}.txt | tr -d '\n\r ' | base64 --decode > public/img/title-london.webp
            python - <<'PY'
          from pathlib import Path
          image = Path('public/img/title-london.webp')
          data = image.read_bytes()
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]:
              raise SystemExit('Rebuilt title artwork is not a valid WEBP file')
          if len(data) < 40000:
              raise SystemExit(f'Rebuilt title artwork is unexpectedly small: {len(data)} bytes')
          title = Path('src/components/Title.tsx')
          source = title.read_text()
          source = source.replace('img/title-london.jpg', 'img/title-london.webp')
          title.write_text(source)
          print(f'London title artwork restored: {len(data)} bytes')
          PY
          fi

      - name: Import promised-lead crown icon
        working-directory: game_source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Projects.tsx')
          s = p.read_text()
          head = s.split('} from "lucide-react";', 1)[0]
          if '  Crown,\n' not in head:
              s = s.replace('  Calendar,\n', '  Calendar,\n  Crown,\n', 1)
              p.write_text(s)
          PY

      - name: Apply discovery-gated cast filtering
        working-directory: game_source
        run: node scripts/patch-cast-secret-visibility.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests and regenerate runtime
        working-directory: game_source
        run: npm test

      - name: Verify all expansion genres are researchable
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runtime = JSON.parse(fs.readFileSync('src/engine/generated/genreV3.json', 'utf8'));
          const required = ['vampire', 'grimdark', 'monster_taming', 'crime', 'kaiju', 'cosmic_horror', 'arabia'];
          if (runtime.genres.length !== 30) throw new Error(`Expected 30 genres, got ${runtime.genres.length}`);
          for (const id of required) {
            const genre = runtime.genres.find((g) => g.id === id);
            if (!genre) throw new Error(`Missing expansion genre: ${id}`);
            if (!(genre.rd > 0)) throw new Error(`Expansion genre is not researchable: ${id}`);
          }
          console.log('Verified 30 genres and all 7 expansion genres are researchable in R&D.');
          NODE

      - name: Build browser dist
        working-directory: game_source
        run: npm run build

      - name: Verify compiled GitHack bundle contains Genre 30 and London title
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const required = [
            ['vampire', 'Vampire'],
            ['grimdark', 'Grimdark'],
            ['monster_taming', 'Monster Taming'],
            ['crime', 'Crime'],
            ['kaiju', 'Kaiju'],
            ['cosmic_horror', 'Cosmic Horror'],
            ['arabia', 'Arabia'],
          ];
          for (const [id, label] of required) {
            if (!html.includes(id)) throw new Error(`Compiled browser bundle missing genre id: ${id}`);
            if (!html.includes(label)) throw new Error(`Compiled browser bundle missing genre label: ${label}`);
          }
          if (fs.existsSync('public/img/title-london-b64')) {
            if (!html.includes('title-london.webp')) throw new Error('Compiled browser bundle is not wired to the approved London title artwork.');
            const titleBytes = fs.readFileSync('dist/img/title-london.webp');
            if (!titleBytes.subarray(0, 4).equals(Buffer.from('RIFF'))) throw new Error('Compiled London title asset is invalid.');
          }
          console.log('Verified compiled browser bundle contains Genre 30 and the approved London title artwork.');
          NODE

      - name: Commit refreshed runtime and dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            game_source/src/components/Title.tsx \
            game_source/public/img/title-london.webp \
            game_source/src/components/Projects.tsx \
            game_source/src/components/Create.tsx \
            game_source/src/engine/castDisplayOrder.ts \
            game_source/src/engine/__tests__/cast-display-filter.test.ts \
            game_source/src/engine/__tests__/cast-coverage.test.ts \
            game_source/src/engine/__tests__/cast-portrait-wiring-regression.test.ts \
            game_source/src/engine/generated/castV3.json \
            game_source/src/engine/generated/genreV3.json \
            game_source/src/engine/generated/arcV3.json \
            game_source/docs/content-v3/CAST_V3_TYPE_PAIR_COVERAGE.csv \
            game_source/dist
          if git diff --cached --quiet; then
            echo 'runtime, London title artwork and dist already current'
          else
            git commit -m 'Refresh GitHack dist for current branch'
            git push origin HEAD:${{ github.ref_name }}
          fi
