name: Publish GitHack dist

on:
  push:
    branches:
      - main
    paths:
      - "game_source/src/**"
      - "game_source/public/**"
      - "game_source/scripts/**"
      - "game_source/docs/content-v3/**"
      - "game_source/docs/content-v5/**"
      - "game_source/docs/content-v6/**"
      - "game_source/art_src/cast_v6_genre30_upload_staging/**"
      - "game_source/package.json"
      - "game_source/package-lock.json"
      - "game_source/vite.config.*"
      - ".github/workflows/publish-githack-dist.yml"

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import promised-lead crown icon
        working-directory: game_source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Projects.tsx')
          s = p.read_text()
          head = s.split('} from "lucide-react";', 1)[0]
          if '  Crown,\n' not in head:
              s = s.replace('  Calendar,\n', '  Calendar,\n  Crown,\n', 1)
              p.write_text(s)
          PY

      - name: Surface promised leads in rush and edit screens
        working-directory: game_source
        run: |
          python - <<'PY'
          from pathlib import Path

          produce = Path('src/components/Produce.tsx')
          s = produce.read_text()
          s = s.replace(
              'import { Building2, ChevronLeft, MonitorPlay, Music4, PenTool, Scissors } from "lucide-react";',
              'import { Building2, ChevronLeft, Crown, MonitorPlay, Music4, PenTool, Scissors } from "lucide-react";'
          )
          s = s.replace(
              'import { MILESTONE_LABEL, draftCost } from "../engine/projects";',
              'import { MILESTONE_LABEL, TEAM_MAX, draftCost } from "../engine/projects";\nimport { expansionOf } from "../engine/studioExpansion";'
          )
          s = s.replace(
              'export default function Produce({ run, project, milestone, workPulses = [], onDone, onBack }: {',
              'export default function Produce({ run, project, milestone, workPulses = [], onAppointPromise, onDone, onBack }: {'
          )
          s = s.replace(
              '  workPulses?: DeskPulse[];\n  onDone: (o: MilestoneOutcome) => void;',
              '  workPulses?: DeskPulse[];\n  onAppointPromise: (projectId: string, promiseId: string) => void;\n  onDone: (o: MilestoneOutcome) => void;'
          )
          anchor = '  const team = useMemo(() => run.staff.filter((s) => project.staffIds.includes(s.id)), [run.staff, project.staffIds]);\n'
          helper = '''  const team = useMemo(() => run.staff.filter((s) => project.staffIds.includes(s.id)), [run.staff, project.staffIds]);
  const expansion = expansionOf(run);
  const productionCredit = expansion.credits[project.id];
  const promiseCandidates = expansion.promises.filter((promise) =>
    promise.status === "active" &&
    (!promise.projectId || promise.projectId === project.id) &&
    !project.commission &&
    !project.draft.continuation &&
    !project.draft.licensedIpId &&
    project.draft.genres.includes(promise.genre)
  );
  const phasePromiseRole = phase
    ? phase.type === "story"
      ? "writer"
      : phase.type === "art"
        ? "animator"
        : "composer"
    : null;
  const renderPromiseActions = (role?: "writer" | "animator" | "composer") => {
    const relevant = promiseCandidates.filter((promise) => !role || promise.role === role);
    if (!relevant.length) return null;
    return (
      <div className="mt-3 space-y-2">
        {relevant.map((promise) => {
          const creator = run.staff.find((st) => st.id === promise.staffId);
          if (!creator) return null;
          const total = productionCredit?.byRole[promise.role] ?? 0;
          const creatorDays = productionCredit?.roleStaff[promise.staffId] ?? 0;
          const participation = total > 0 ? Math.round((creatorDays / total) * 100) : 0;
          const named = productionCredit?.leads[promise.role] === promise.staffId && promise.projectId === project.id;
          const conflictingLead = !!productionCredit?.leads[promise.role] && productionCredit.leads[promise.role] !== promise.staffId;
          const alreadyAssigned = project.staffIds.includes(promise.staffId);
          const early = project.stage === "concept" && total === 0;
          const earnedLate = total > 0 && participation >= 60;
          const canAutoAssign = alreadyAssigned || project.staffIds.length < TEAM_MAX;
          const canName = !named && !conflictingLead && canAutoAssign && (early || (alreadyAssigned && earnedLate));
          const leadLabel = promise.role === "writer" ? "WRITING" : promise.role === "animator" ? "ANIMATION" : "SOUND";
          return (
            <div key={promise.id} className="rounded-xl border border-viol/55 bg-viol/10 p-3">
              <div className="flex items-center gap-2">
                <Crown size={14} className="shrink-0 text-gold" />
                <div className="min-w-0 flex-1">
                  <div className="truncate text-[10px] font-black tracking-wider text-gold">PROMISED {leadLabel} LEAD</div>
                  <div className="truncate text-[10px] text-paper/70">{creator.name} · {participation}% department participation</div>
                </div>
                {named && <span className="rounded bg-mint/15 px-1.5 py-0.5 text-[8px] font-black text-mint">NAMED</span>}
              </div>
              {!named && canName && (
                <Btn variant="gold" className="mt-2 w-full !py-1.5 text-[10px]" onClick={() => onAppointPromise(project.id, promise.id)}>
                  <Crown size={12} /> {alreadyAssigned ? `NAME ${creator.name.toUpperCase()} ${leadLabel} LEAD` : `ASSIGN + NAME ${creator.name.toUpperCase()} ${leadLabel} LEAD`}
                </Btn>
              )}
              {!named && !canName && (
                <div className="mt-1.5 text-[9px] text-paper/50">
                  {conflictingLead
                    ? `Another ${leadLabel.toLowerCase()} lead is already named.`
                    : !canAutoAssign
                      ? "Team is full — make a slot before naming this promised lead."
                      : total > 0
                        ? `Keep ${creator.name} on the project until they reach 60% of ${leadLabel.toLowerCase()} production days. Current: ${participation}%.`
                        : `Assign ${creator.name} before ${leadLabel.toLowerCase()} work begins, or they can still earn the role later at 60% participation.`}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };
'''
          if anchor not in s:
              raise SystemExit('Produce team anchor not found')
          s = s.replace(anchor, helper, 1)
          edit_anchor = '            <p className="mt-1 text-xs text-paper/55">Editing notes only move one way: down. Keep the calendar running to chase a cleaner master; every cleared note improves final quality and earns +1 RD. The trade-off is time and money.</p>\n          </div>\n\n'
          if edit_anchor not in s:
              raise SystemExit('Edit Bay anchor not found')
          s = s.replace(edit_anchor, edit_anchor + '          {renderPromiseActions()}\n\n', 1)
          plan_anchor = '            <p className="mt-1 text-xs text-paper/55">Set the balance, appoint one specialist, then the rush resolves as a short studio spotlight. Their skill sets the RNG floor and ceiling.</p>\n          </div>\n'
          if plan_anchor not in s:
              raise SystemExit('Rush plan anchor not found')
          s = s.replace(plan_anchor, plan_anchor + '          {phasePromiseRole && renderPromiseActions(phasePromiseRole)}\n', 1)
          assign_anchor = '          <div className="text-center"><div className="text-[11px] tracking-[0.4em] text-cyanx">{phase!.name}</div><h2 className="font-display text-3xl font-extrabold">WHO GETS THE SPOTLIGHT?</h2><p className="mt-1 text-xs text-paper/55">Higher relevant skill raises both the minimum and maximum result. The reveal is instant and does not consume calendar days.</p></div>\n'
          if assign_anchor not in s:
              raise SystemExit('Rush assign anchor not found')
          s = s.replace(assign_anchor, assign_anchor + '          {phasePromiseRole && renderPromiseActions(phasePromiseRole)}\n', 1)
          produce.write_text(s)

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace('  applyMilestone,\n  initialRun,', '  applyMilestone,\n  assignToProject,\n  initialRun,', 1)
          app_import = 'import BigThreeReveal from "./components/BigThreeReveal";\n'
          if app_import not in s:
              raise SystemExit('App import anchor not found')
          s = s.replace(app_import, app_import + 'import { appointCreativeLead, expansionOf } from "./engine/studioExpansion";\n', 1)
          milestone_anchor = '''  const finishMilestone = useCallback(
    (o: MilestoneOutcome) => {
      if (!focus) return;
      sfx.reveal();
      setRun((r) => (r ? applyMilestone(r, focus.projectId, o) : r));
      setFocus(null);
      setScreen("office");
    },
    [focus]
  );

'''
          if milestone_anchor not in s:
              raise SystemExit('App milestone anchor not found')
          appointment = '''  const appointPromiseLead = useCallback((projectId: string, promiseId: string) => {
    sfx.click();
    setRun((current) => {
      if (!current) return current;
      const promise = expansionOf(current).promises.find((p) => p.id === promiseId);
      const project = current.projects.find((p) => p.id === projectId);
      if (!promise || !project) return current;
      const staged = project.staffIds.includes(promise.staffId)
        ? current
        : assignToProject(current, projectId, promise.staffId);
      const assigned = staged.projects.find((p) => p.id === projectId)?.staffIds.includes(promise.staffId);
      if (!assigned) return current;
      return appointCreativeLead(staged, projectId, promiseId) ?? current;
    });
  }, []);

'''
          s = s.replace(milestone_anchor, milestone_anchor + appointment, 1)
          prop_anchor = '            workPulses={workPulses}\n            onDone={finishMilestone}\n'
          if prop_anchor not in s:
              raise SystemExit('Produce prop anchor not found')
          s = s.replace(prop_anchor, '            workPulses={workPulses}\n            onAppointPromise={appointPromiseLead}\n            onDone={finishMilestone}\n', 1)
          app.write_text(s)

          audit = Path('docs/THREE_CLICK_UX_AUDIT.md')
          s = audit.read_text()
          s = s.replace(
              'New path: Office → Project Board → **ASSIGN + NAME [CREATOR] [DEPARTMENT] LEAD**. Two clicks from the office if the project qualifies. The promise card is visible beside team/rush/intervention controls. If the creator was not named before department work began, they can still earn the appointment later once they personally hold at least 60% of the department\'s recorded production days. This keeps the promise meaningful without creating a hidden irreversible failure.',
              'New paths: Office → Project Board → **ASSIGN + NAME [CREATOR] [DEPARTMENT] LEAD** (two clicks), or act directly inside the relevant Story / Animation / Sound rush with no detour. The Edit Bay also shows any still-unfulfilled promised lead who has earned at least 60% of their department\'s recorded production days. The Project Board remains the overview; rush/edit screens are contextual shortcuts. This keeps the promise meaningful without creating a hidden irreversible failure.'
          )
          s = s.replace(
              '| Name promised creative lead | Project Board → promise action | 2 | PASS after this patch | Keep on project card and surface progress % |',
              '| Name promised creative lead | Project Board → promise action, or relevant Rush/Edit Bay → promise action | 1–2 | PASS | Keep the same action in every production context where it becomes eligible |'
          )
          s = s.replace(
              '5. **Do not count meaningful creative decisions as navigation.** Building a show can involve many creative selections. The three-click rule is about getting to the relevant decision, not deleting game depth.',
              '5. **Contextual parity.** A production action that becomes eligible while the player is in a rush, edit, release or project screen must appear there as well as on its dashboard; never force a back-out-and-reopen loop.\n6. **Do not count meaningful creative decisions as navigation.** Building a show can involve many creative selections. The three-click rule is about getting to the relevant decision, not deleting game depth.'
          )
          audit.write_text(s)
          PY

      - name: Apply discovery-gated cast filtering
        working-directory: game_source
        run: node scripts/patch-cast-secret-visibility.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests and regenerate runtime
        working-directory: game_source
        run: npm test

      - name: Verify all expansion genres are researchable
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runtime = JSON.parse(fs.readFileSync('src/engine/generated/genreV3.json', 'utf8'));
          const required = ['vampire', 'grimdark', 'monster_taming', 'crime', 'kaiju', 'cosmic_horror', 'arabia'];
          if (runtime.genres.length !== 30) throw new Error(`Expected 30 genres, got ${runtime.genres.length}`);
          for (const id of required) {
            const genre = runtime.genres.find((g) => g.id === id);
            if (!genre) throw new Error(`Missing expansion genre: ${id}`);
            if (!(genre.rd > 0)) throw new Error(`Expansion genre is not researchable: ${id}`);
          }
          console.log('Verified 30 genres and all 7 expansion genres are researchable in R&D.');
          NODE

      - name: Build browser dist
        working-directory: game_source
        run: npm run build

      - name: Verify compiled GitHack bundle contains Genre 30
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const required = [
            ['vampire', 'Vampire'],
            ['grimdark', 'Grimdark'],
            ['monster_taming', 'Monster Taming'],
            ['crime', 'Crime'],
            ['kaiju', 'Kaiju'],
            ['cosmic_horror', 'Cosmic Horror'],
            ['arabia', 'Arabia'],
          ];
          for (const [id, label] of required) {
            if (!html.includes(id)) throw new Error(`Compiled browser bundle missing genre id: ${id}`);
            if (!html.includes(label)) throw new Error(`Compiled browser bundle missing genre label: ${label}`);
          }
          console.log('Verified compiled browser bundle contains Vampire, Grimdark and all five Genre 30 expansion genres.');
          NODE

      - name: Commit refreshed runtime and dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/publish-githack-dist.yml
          git add -f \
            .github/workflows/publish-githack-dist.yml \
            game_source/src/App.tsx \
            game_source/src/components/Produce.tsx \
            game_source/src/components/Projects.tsx \
            game_source/src/components/Create.tsx \
            game_source/src/engine/castDisplayOrder.ts \
            game_source/src/engine/__tests__/cast-display-filter.test.ts \
            game_source/src/engine/__tests__/cast-coverage.test.ts \
            game_source/src/engine/__tests__/cast-portrait-wiring-regression.test.ts \
            game_source/src/engine/generated/castV3.json \
            game_source/src/engine/generated/genreV3.json \
            game_source/src/engine/generated/arcV3.json \
            game_source/docs/THREE_CLICK_UX_AUDIT.md \
            game_source/docs/content-v3/CAST_V3_TYPE_PAIR_COVERAGE.csv \
            game_source/dist
          if git diff --cached --quiet; then
            echo 'runtime and promised-lead UX already current'
          else
            git commit -m 'Surface promised leads in rush and edit screens'
            git push origin HEAD:main
          fi