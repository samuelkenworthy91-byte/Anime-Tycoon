name: Clean consequences branch validation tooling

on:
  push:
    branches:
      - work/consequences-discovery-critical-voice
    paths:
      - ".github/workflows/cleanup-consequences-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/consequences-discovery-critical-voice
          fetch-depth: 0
      - name: Remove temporary validation tooling
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/apk.yml
          rm -f \
            .github/workflows/diagnose-consequences-tests.yml \
            .github/workflows/final-sequel-edges.yml \
            .github/workflows/finalize-sequel-salvage.yml \
            .github/workflows/finish-consequences-branch-v2.yml \
            .github/workflows/finish-consequences-branch.yml \
            .github/workflows/fix-franchise-test-fixture.yml \
            .github/workflows/cleanup-consequences-branch.yml \
            TEST_FAILURES.tmp.txt \
            scripts/final-sequel-edges.mjs \
            scripts/finish-consequences-branch-v2.mjs \
            scripts/finish-consequences-branch.mjs
          git add -A
          git diff --cached --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary branch validation tooling"
          git push origin HEAD:work/consequences-discovery-critical-voice
