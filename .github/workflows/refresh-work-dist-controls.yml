name: Refresh Work Branch Dist Controls

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
    paths:
      - .github/workflows/refresh-work-dist-controls.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/midgame-endgame-systems-pass
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Build production browser bundle
        working-directory: game_source
        run: npm run build

      - name: Verify collapsible controls compiled
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          for (const marker of ['game-controls-toggle', 'game-controls-open', 'game-controls-panel']) {
            if (!html.includes(marker)) throw new Error(`Compiled bundle missing collapsible controls marker: ${marker}`);
          }
          console.log('Compiled browser bundle contains APK-style collapsible controls.');
          NODE

      - name: Commit refreshed dist
        run: |
          git config user.name 'samuelkenworthy91-byte'
          git config user.email 'samuel.kenworthy91@gmail.com'
          git add -f game_source/dist
          if git diff --cached --quiet; then
            echo 'dist already current'
          else
            git commit -m 'Refresh browser bundle with collapsible controls'
            git push origin HEAD:work/midgame-endgame-systems-pass
          fi
