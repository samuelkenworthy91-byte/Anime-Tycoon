name: Temporary QoL Poster Validation

on:
  push:
    branches:
      - qol-pass-2-2026-09-19
    paths:
      - game_source/public/rival-posters/**
      - game_source/src/engine/generated/rivalPosterManifest.json
      - game_source/src/engine/generated/sharedIndustryPosterCatalog.json
      - game_source/src/engine/rivalPosters.ts
      - game_source/src/engine/__tests__/rivalPosters.test.ts
      - game_source/src/engine/__tests__/shared-industry-posters.test.ts
      - game_source/scripts/finalize-rival-posters.mjs
      - .github/workflows/qol-poster-validation-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Verify poster finalizer is deterministic
        working-directory: game_source
        run: |
          node scripts/finalize-rival-posters.mjs
          git diff --exit-code --             public/rival-posters/imported             src/engine/generated/rivalPosterManifest.json

      - name: Poster-specific tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/rivalPosters.test.ts src/engine/__tests__/shared-industry-posters.test.ts --reporter=dot

      - name: Full test suite
        working-directory: game_source
        run: npm test -- --reporter=dot

      - name: Production web build
        working-directory: game_source
        run: npm run build
