name: Apply scroll and pun-title update

on:
  push:
    branches:
      - arena/01a0608d-anime-tycoon
    paths:
      - .github/workflows/apply-scroll-pun-titles.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0608d-anime-tycoon
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Apply requested source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          title_path = Path('game_source/src/components/Title.tsx')
          title = title_path.read_text()
          old_outer = 'className="relative h-full w-full overflow-hidden bg-ink"'
          new_outer = 'className="relative min-h-full w-full overflow-x-hidden overflow-y-auto overscroll-y-contain bg-ink"'
          old_inner = 'className="relative z-10 mx-auto flex h-full max-w-5xl flex-col items-center justify-between px-4 py-6 md:py-8"'
          new_inner = 'className="relative z-10 mx-auto flex min-h-full max-w-5xl flex-col items-center justify-between gap-6 px-4 py-6 pb-10 md:py-8"'
          assert old_outer in title, 'Title outer viewport class changed unexpectedly'
          assert old_inner in title, 'Title inner layout class changed unexpectedly'
          title = title.replace(old_outer, new_outer, 1).replace(old_inner, new_inner, 1)
          title_path.write_text(title)

          data_path = Path('game_source/src/engine/data.ts')
          data = data_path.read_text()
          rival_line = 'export const RIVAL_STUDIOS = ["Toe-i Animation", "Sunnyrise", "Boneworks", "Kyo-Hani", "Madcap House", "Turtle Line"];'
          assert rival_line in data, 'Rival studio names changed before requested patch'

          pun_block = '''export const PUN_TITLES = [
            "My Hero Acrimony",
            "Narutoast",
            "Two Pieces",
            "Dragon Bowl Z",
            "Snack on Titan",
            "Demon Snoozer",
            "Jujutsu Kaizen",
            "Pocket Fiends",
            "Sailor Spoon",
            "Fullmetal Accountant",
            "Cowboy Beep-Bop",
            "Spy x Flatpack",
            "Death Nope",
            "Sword Part Offline",
            "Tokyo Ghoulish",
            "Frieren: Beyond Journey's Brunch",
            "Chainsaw Woman",
            "Hunter x Plumber",
            "Bleech",
            "Fairy Tale",
            "Blockyuu!!",
            "K-Onion",
            "Neon Genesis Vegetarian",
            "Gumdrop Wing",
            "Steins;Gateau",
            "Mob Psycho 101",
            "Two Punch Man",
            "JoJo's Bizarre Accounting",
            "Tokyo Redecorators",
            "Vinland Salsa",
            "Black Cloverfield",
            "Dandadandan",
            "Oshi no Know",
            "Your Name? Again",
            "Spirited Away: The Sequel",
            "Howl's Moving Shed",
            "Princess Mononoke-y",
            "Ghost in the Shop",
            "Attack on Tofu",
            "One Peace Treaty",
            "Blue Exorcise",
            "Dr. Scone",
            "Fire Farce",
            "Soul Heater",
            "Code Ge-assignment",
            "Psycho-Passport",
            "Parasyte: The Maximum Rent",
            "Noragami-nation",
            "Erased Again",
            "Made in a Biscuit",
            "The Promised Neverlandlord",
            "Food Wars: Shokugeki no Sofa",
            "Cells at Work From Home",
            "Haikyu Later",
            "Kuroko's Basket Case",
            "Ace of Diamond Cutters",
            "Initial Tea",
            "Yuri on Rice",
            "Free! Shipping",
            "Blue Lockdown",
            "Slam Drunk",
            "Run with the Windows Open",
            "Bocchi the Crock",
            "Horimiya Later",
            "Toradora the Explorer",
            "Kaguya-sama: Love Is Floor",
            "My Dress-Up Darling Budget",
            "Rent-a-Girlfriend's Flat",
            "The Quintessential Quintuplets' Accountant",
            "Clannadwich",
            "Anohana Means No Refunds",
            "March Comes in Like a Layoff",
            "Violet Evergarden Centre",
            "Nana Bread",
            "Fruits Basket Case",
            "Ouran High School Host Invoice",
            "Lovely Complex Spreadsheet",
            "Cardcaptor Salary",
            "Sailor Profit",
            "Madoka Magica Mortgage",
            "Re:Zero Budget",
            "That Time I Got Reincarnated as a Slime Mould",
            "Konosuba Contractor",
            "Overlord of the Lease",
            "No Game No Wi-Fi",
            "The Rising of the Shield Invoice",
            "Mushoku Tensei: Jobless Refinance",
            "Sword Art Overtime",
            "Log Horizon Broadband",
            "Gate: Thus the Council Fought There",
            "Delicious in Tax Dungeon",
            "Campfire Cooking in Another World with My Absurd Skill Issue",
            "The Devil Is a Part-Timer's Manager",
            "Uncle from Another Department",
            "Solo Levelling the Books",
            "Tower of Admin",
            "God of High School Fees",
            "Bungo Stray Dogsbody",
            "Black Butler Service Charge",
            "Blue Period Drama",
            "Beastars and Stripes",
