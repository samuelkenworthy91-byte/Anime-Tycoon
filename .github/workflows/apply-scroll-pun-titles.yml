            "Yu Yu Hakusho Kiosk",
            "Saint Seiya Later",
            "Fist of the North Star Rating",
            "Gintama Receipt",
            "Dragon Quest: The Adventure of VAT",
            "Digimon Adventure Time Sheet",
            "Pokémon Concierge Fee",
            "Detective Conan the Contractor",
            "Lupin the Third Floor",
            "Case Closed for Lunch",
            "The Apothecary Diaries Department",
            "Skip and Loafer Payment",
            "Insomniacs After School Run",
            "Call of the Night Shift",
            "Zom 100: Bucket List of the Budget",
            "Mashle: Magic and Muscles and Metrics",
            "Undead Unpaid",
            "Kaiju No. Invoice",
            "Wind Breaker Room",
            "Hell's Paradise Payroll",
            "Ranking of Kingsize Beds",
            "Ranking of Queens",
            "To Your Eternity Contract",
            "Land of the Lustrous Expenses",
            "Ancient Magus' Bride Price",
            "The Faraway Paladin Invoice",
            "Goblin Slayer's Tax Return",
            "Claymore Coffee",
            "Berserk at the Printer",
            "Golden Kamuy Later",
            "Drifting Dragons' Expenses",
            "Space Dandy Budget",
            "Planetes and Pensions",
            "Legend of the Galactic Payroll",
            "Mobile Suit Gumdam",
            "Gurren Login",
            "Eureka Seven-Eleven",
            "Darling in the Fax",
            "Macrossed Wires",
            "86 Unread Emails",
            "Aldnoah.Zero Budget",
            "Knights of Sidonia Deposit",
            "Patlabor Day",
            "Akira Rental",
            "Paprika Invoice",
            "Perfect Blue Screen",
            "Millennium Actress Fee",
            "Summer Wars and Conditions",
            "Wolf Children Allowance",
            "The Girl Who Leapt Through Payroll",
            "Weathering with Debt",
            "Suzume's Door Invoice",
            "A Silent Invoice",
            "Belle and the Budget",
            "Ponyo on the Payroll",
            "Castle in the Spreadsheet",
            "Kiki's Delivery Surcharge",
            "Nausicaä of the Valley of the Windfall",
            "The Boy and the Heron Account",
          ];'''

          data, count = re.subn(r'export const PUN_TITLES = \[\n.*?\n\];', pun_block, data, count=1, flags=re.S)
          assert count == 1, 'Could not replace PUN_TITLES exactly once'

          old_random = '''export function randomTitle(): string {
            const a = SPIRITS_A[Math.floor(Math.random() * SPIRITS_A.length)];
            const b = SPIRITS_B[Math.floor(Math.random() * SPIRITS_B.length)];
            const c = Math.random() < 0.4 ? ` ${SPIRITS_C[Math.floor(Math.random() * SPIRITS_C.length)]}` : "";
            return `${a} ${b}${c}`;
          }'''
          new_random = '''export function randomTitle(): string {
            // Most suggested project names are anime-title parodies; keep the
            // original procedural generator in the mix for occasional fresh originals.
            if (Math.random() < 0.72) return PUN_TITLES[Math.floor(Math.random() * PUN_TITLES.length)];
            const a = SPIRITS_A[Math.floor(Math.random() * SPIRITS_A.length)];
            const b = SPIRITS_B[Math.floor(Math.random() * SPIRITS_B.length)];
            const c = Math.random() < 0.4 ? ` ${SPIRITS_C[Math.floor(Math.random() * SPIRITS_C.length)]}` : "";
            return `${a} ${b}${c}`;
          }'''
          assert old_random in data, 'randomTitle implementation changed unexpectedly'
          data = data.replace(old_random, new_random, 1)
          assert rival_line in data, 'Rival studio names were altered by patch'
          data_path.write_text(data)
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Build web app
        working-directory: game_source
        run: npm run build

      - name: Commit requested changes
        run: |
          git config user.name "chatgpt-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/components/Title.tsx game_source/src/engine/data.ts
          git commit -m "Make studio setup scrollable and expand anime pun titles"
          git push origin HEAD:arena/01a0608d-anime-tycoon
