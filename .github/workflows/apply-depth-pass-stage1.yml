name: Apply Depth Pass Stage 1

on:
  push:
    branches:
      - work/research-showrunner-auction-depth-pass
    paths:
      - .github/workflows/apply-depth-pass-stage1.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/research-showrunner-auction-depth-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply implementation
        working-directory: game_source
        run: node scripts/apply-depth-pass-stage1.mjs
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/src
          git commit -m 'Implement research and staff depth stage' || true
          git push origin HEAD:work/research-showrunner-auction-depth-pass
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Targeted tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/depth-pass-stage1.test.ts src/engine/__tests__/arc-discovery.test.ts src/engine/__tests__/careers.test.ts src/engine/__tests__/staff-potential-business.test.ts
      - name: Full tests
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
