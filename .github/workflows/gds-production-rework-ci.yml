name: GDS Production Rework CI

on:
  push:
    branches:
      - feature/deeper-studio-loop
    paths:
      - ".github/workflows/gds-production-rework-ci.yml"
      - "tools/apply_gds_production_loop.py"

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deeper-studio-loop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Apply continuous production rework
        run: python tools/apply_gds_production_loop.py
      - name: Test
        working-directory: game_source
        run: npm test
      - name: Build
        working-directory: game_source
        run: npm run build
      - name: Commit implementation and browser build
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source
          git add -f game_source/dist
          git commit -m "Rework production into continuous studio rushes"
          git push origin HEAD:feature/deeper-studio-loop
