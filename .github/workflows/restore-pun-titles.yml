name: Restore approved pun-title pool

on:
  push:
    branches:
      - tmp-restore-pun-titles-qa
    paths:
      - ".github/workflows/restore-pun-titles.yml"

permissions:
  contents: write

jobs:
  restore-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Restore approved pun titles
        env:
          EXTRA_TITLES_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, os

          path = Path("game_source/src/engine/data.ts")
          text = path.read_text(encoding="utf-8")
          if '"Blue Exorcise"' not in text:
              anchor = '  "One Peace Treaty",\n];\n\nexport interface RivalShow'
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one PUN_TITLES insertion anchor, found {text.count(anchor)}")
              extra = base64.b64decode(os.environ["EXTRA_TITLES_B64"]).decode("utf-8")
              text = text.replace(anchor, '  "One Peace Treaty",\n' + extra + '];\n\nexport interface RivalShow', 1)
              path.write_text(text, encoding="utf-8")

          final = path.read_text(encoding="utf-8")
          assert final.count('"Blue Exorcise"') == 1
          assert final.count('"The Boy and the Heron Account"') == 1
          print("Approved pun-title pool restored without changing rival studio names or mechanics.")
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Production build
        working-directory: game_source
        run: npm run build

      - name: Commit QA-passed update
        run: |
          set -euo pipefail
          git config user.name "samuelkenworthy91-byte"
          git config user.email "234389189+samuelkenworthy91-byte@users.noreply.github.com"
          git add game_source/src/engine/data.ts
          git rm .github/workflows/restore-pun-titles.yml
          git commit -m "Restore expanded anime pun title pool"
          git push origin HEAD:tmp-restore-pun-titles-qa
