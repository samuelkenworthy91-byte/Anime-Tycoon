  "Ancient Magus' Bride Price",
  "The Faraway Paladin Invoice",
  "Goblin Slayer's Tax Return",
  "Claymore Coffee",
  "Berserk at the Printer",
  "Golden Kamuy Later",
  "Drifting Dragons' Expenses",
  "Space Dandy Budget",
  "Planetes and Pensions",
  "Legend of the Galactic Payroll",
  "Mobile Suit Gumdam",
  "Gurren Login",
  "Eureka Seven-Eleven",
  "Darling in the Fax",
  "Macrossed Wires",
  "86 Unread Emails",
  "Aldnoah.Zero Budget",
  "Knights of Sidonia Deposit",
  "Patlabor Day",
  "Akira Rental",
  "Paprika Invoice",
  "Perfect Blue Screen",
  "Millennium Actress Fee",
  "Summer Wars and Conditions",
  "Wolf Children Allowance",
  "The Girl Who Leapt Through Payroll",
  "Weathering with Debt",
  "Suzume's Door Invoice",
  "A Silent Invoice",
  "Belle and the Budget",
  "Ponyo on the Payroll",
  "Castle in the Spreadsheet",
  "Kiki's Delivery Surcharge",
  "Nausicaä of the Valley of the Windfall",
  "The Boy and the Heron Account",
'''
              text = text.replace(anchor, '  "One Peace Treaty",\n' + extra + '];\n\nexport interface RivalShow', 1)
              path.write_text(text, encoding="utf-8")

          final = path.read_text(encoding="utf-8")
          assert final.count('"Blue Exorcise"') == 1
          assert final.count('"The Boy and the Heron Account"') == 1
          print("Approved pun-title pool restored without changing rival studio names or mechanics.")
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Production build
        working-directory: game_source
        run: npm run build

      - name: Commit QA-passed update
        run: |
          set -euo pipefail
          git config user.name "samuelkenworthy91-byte"
          git config user.email "234389189+samuelkenworthy91-byte@users.noreply.github.com"
          git add game_source/src/engine/data.ts
          git rm .github/workflows/restore-pun-titles.yml
          git commit -m "Restore expanded anime pun title pool"
          git push origin HEAD:tmp-restore-pun-titles-qa
