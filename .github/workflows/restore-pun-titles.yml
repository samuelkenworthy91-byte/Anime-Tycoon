name: Restore approved pun-title pool

on:
  push:
    branches:
      - tmp-restore-pun-titles-qa
    paths:
      - ".github/workflows/restore-pun-titles.yml"

permissions:
  contents: write

jobs:
  restore-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Restore approved pun titles
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("game_source/src/engine/data.ts")
          text = path.read_text(encoding="utf-8")
          if '"Blue Exorcise"' not in text:
              anchor = '  "One Peace Treaty",\n];\n\nexport interface RivalShow'
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one PUN_TITLES insertion anchor, found {text.count(anchor)}")
              extra = '''  "Blue Exorcise",
  "Dr. Scone",
  "Fire Farce",
  "Soul Heater",
  "Code Ge-assignment",
  "Psycho-Passport",
  "Parasyte: The Maximum Rent",
  "Noragami-nation",
  "Erased Again",
