name: Finalize rival poster backlog (hi-res)

on:
  push:
    branches:
      - work/final-awards-rival-posters
    paths:
      - game_source/art_src/rival/external/atlases/poster_sheet_20.webp

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: work/final-awards-rival-posters
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Materialize 160 individual rival posters
        run: python game_source/scripts/finalize-rival-posters.py

      - name: Verify poster output
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('game_source/public/rival-posters/generated')
          files = sorted(out.glob('*.webp'))
          assert len(files) == 160, f'expected 160 generated posters, got {len(files)}'
          for p in files:
              with Image.open(p) as im:
                  assert im.size == (480, 600), f'{p.name}: {im.size}'
          print('poster output PASS: 160 / 160 at 480x600')
          PY

      - name: Install app dependencies
        working-directory: game_source
        run: npm ci

      - name: Test
        working-directory: game_source
        run: npm test

      - name: Build
        working-directory: game_source
        run: npm run build

      - name: Cast coverage audit
        working-directory: game_source
        run: npm run cast:coverage

      - name: Remove superseded staging shards
        run: |
          rm -f game_source/art_src/rival/external/rivalPosterImages*.json
          rm -f game_source/art_src/rival/external/rival_poster_atlas_20.zip

      - name: Commit validated runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/public/rival-posters/generated \
                  game_source/src/engine/generated/rivalPosterManifest.json \
                  game_source/src/components/Create.tsx \
                  game_source/docs/rival-poster-import-map.csv \
                  game_source/art_src/rival/external
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Finalize 160 rival posters and contextual known fits'
            git push origin HEAD:work/final-awards-rival-posters
          fi
