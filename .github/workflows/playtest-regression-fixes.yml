name: Apply Playtest Regression Fixes

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
    paths:
      - .github/workflows/playtest-regression-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/midgame-endgame-systems-pass
          fetch-depth: 0

      - name: Apply playtest fixes
        run: python game_source/scripts/apply-playtest-regression-fixes.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run focused playtest regressions
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/presentation.test.ts src/engine/__tests__/recruitment-ads.test.ts src/engine/__tests__/worker-easter-egg.test.ts src/engine/__tests__/showrunner-abilities.test.ts src/engine/__tests__/showrunner-expansion.test.ts src/engine/__tests__/playtest-regressions.test.ts --reporter=verbose

      - name: Run full suite
        working-directory: game_source
        run: npm test

      - name: Build production GitHack bundle
        working-directory: game_source
        run: npm run build

      - name: Verify branch bundle is not stale main UI
        working-directory: game_source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          for (const marker of ['Narrative Momentum', 'THE BIG THREE', 'CARVE THE NAME']) {
            if (!html.includes(marker)) throw new Error(`Compiled GitHack bundle missing current branch marker: ${marker}`);
          }
          console.log('Compiled dist contains current branch playtest markers.');
          NODE

      - name: Commit source repair and real GitHack dist
        run: |
          git config user.name 'samuelkenworthy91-byte'
          git config user.email 'samuel.kenworthy91@gmail.com'
          git add game_source/src/App.tsx \
                  game_source/src/mobile-layout.css \
                  game_source/src/components/ShowrunnerLevelUpModal.tsx \
                  game_source/src/engine/presentation.ts \
                  game_source/src/engine/careers.ts \
                  game_source/src/engine/scoring.ts \
                  game_source/src/engine/showrunnerImpact.ts \
                  game_source/src/engine/__tests__/presentation.test.ts \
                  game_source/src/engine/__tests__/recruitment-ads.test.ts \
                  game_source/src/engine/__tests__/playtest-regressions.test.ts
          git add -f game_source/dist
          git commit -m 'Fix playtest regressions and refresh GitHack bundle'
          git push origin HEAD:work/midgame-endgame-systems-pass
