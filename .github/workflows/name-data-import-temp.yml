name: Import international name pool

on:
  push:
    branches:
      - fix/posters-rd-names-2026-09-20
    paths:
      - ".github/workflows/name-data-import-temp.yml"

permissions:
  contents: write

jobs:
  import-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/posters-rd-names-2026-09-20
          fetch-depth: 0

      - name: Build 50-country top-name pool
        run: |
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from collections import defaultdict

          GIVEN_URL = "https://github.com/onomaverse/datasets/releases/download/v2026.06/given-name-frequency.csv"
          SURNAME_URL = "https://github.com/onomaverse/datasets/releases/download/v2026.06/surname-frequency.csv"

          def download(url):
              with urllib.request.urlopen(url, timeout=90) as r:
                  return r.read().decode("utf-8-sig")

          given_text = download(GIVEN_URL)
          surname_text = download(SURNAME_URL)

          given = list(csv.DictReader(io.StringIO(given_text)))
          surnames = list(csv.DictReader(io.StringIO(surname_text)))

          # Broad preferred order spanning Europe, the Americas, Africa, the Middle East and Asia-Pacific.
          preferred = [
              "GB","IE","US","CA","AU","NZ",
              "FR","DE","ES","IT","PT","NL","BE","SE","NO","DK","FI","PL","CZ","AT","CH","GR","RO","HU",
              "BR","MX","AR","CO","CL","PE",
              "ZA","NG","GH","KE","EG","MA",
              "TR","IL","SA","AE",
              "IN","PK","BD","JP","KR","CN","TW","PH","ID","MY","SG","TH","VN"
          ]

          latinish = re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿĀ-ž]")
          def usable(name):
              name = (name or "").strip()
              return bool(name) and bool(latinish.search(name)) and len(name) <= 40 and not any(ord(c) < 32 for c in name)

          by_country_gender = defaultdict(lambda: {"male": [], "female": []})
          country_names = {}
          for row in given:
              code = row["country_code"].strip()
              name = row["name"].strip()
              if not usable(name):
                  continue
              country_names[code] = row["country_name"].strip()
              try:
                  count = int(row["count"])
              except Exception:
                  count = 0
              genders = set((row.get("gender") or "").split(";"))
              if "M" in genders:
                  by_country_gender[code]["male"].append((count, name))
              if "F" in genders:
                  by_country_gender[code]["female"].append((count, name))

          by_country_surname = defaultdict(list)
          for row in surnames:
              code = row["country_code"].strip()
              name = row["name"].strip()
              if not usable(name):
                  continue
              country_names.setdefault(code, row["country_name"].strip())
              try:
                  count = int(row["count"])
              except Exception:
                  count = 0
              by_country_surname[code].append((count, name))

          def top_unique(rows, n=100):
              seen=set()
              out=[]
              for count,name in sorted(rows, key=lambda x: (-x[0], x[1].casefold())):
                  key=name.casefold()
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(name)
                  if len(out) >= n:
                      break
              return out

          eligible={}
          for code in set(by_country_gender) & set(by_country_surname):
              male=top_unique(by_country_gender[code]["male"])
              female=top_unique(by_country_gender[code]["female"])
              family=top_unique(by_country_surname[code])
              if len(male) >= 100 and len(female) >= 100 and len(family) >= 100:
                  eligible[code] = {
                      "code": code,
                      "country": country_names.get(code, code),
                      "male": male[:100],
                      "female": female[:100],
                      "surnames": family[:100],
                  }

          selected=[]
          used=set()
          for code in preferred:
              if code in eligible and code not in used:
                  selected.append(eligible[code]); used.add(code)
              if len(selected) == 50:
                  break
          if len(selected) < 50:
              for code in sorted(eligible):
                  if code not in used:
                      selected.append(eligible[code]); used.add(code)
                  if len(selected) == 50:
                      break
          if len(selected) != 50:
              raise SystemExit(f"Needed 50 eligible countries, found {len(selected)}. Eligible total={len(eligible)}")

          payload = {
              "source": {
                  "name": "Onomaverse Names Datasets",
                  "version": "v2026.06",
                  "url": "https://onomaverse.com/datasets",
                  "license": "CC BY 4.0",
                  "attribution": "Names data from Onomaverse (https://onomaverse.com/datasets), licensed CC BY 4.0."
              },
              "countryCount": len(selected),
              "perCountry": {"male": 100, "female": 100, "surnames": 100},
              "countries": selected
          }
          path="game_source/src/engine/generated/internationalNames.json"
          with open(path,"w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))
              f.write("\n")
          print("Selected:", ", ".join(x["code"] for x in selected))
          print("Rows:", sum(len(x["male"])+len(x["female"])+len(x["surnames"]) for x in selected))
          PY

      - name: Validate generated pool
        run: |
          python - <<'PY'
          import json
          p=json.load(open("game_source/src/engine/generated/internationalNames.json",encoding="utf-8"))
          assert p["countryCount"] == 50
          assert len(p["countries"]) == 50
          for c in p["countries"]:
              assert len(c["male"]) == 100
              assert len(c["female"]) == 100
              assert len(c["surnames"]) == 100
          print("Validated", p["countryCount"], "countries")
          PY

      - name: Commit generated data and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/engine/generated/internationalNames.json
          git rm .github/workflows/name-data-import-temp.yml
          git commit -m "Data: add 50-country international name pool"
          git push origin HEAD:fix/posters-rd-names-2026-09-20
