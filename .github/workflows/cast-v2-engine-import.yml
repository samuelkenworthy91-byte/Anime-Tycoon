name: Cast V2 remaining engine import

on:
  push:
    branches:
      - design/cast-v2-canonical

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/cast-v2-canonical
          fetch-depth: 0

      - name: Reconstruct and verify recovered engine archive
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/eng-* | base64 -d > /tmp/cv2-engine.tar.gz
          echo "1b6a2ccbe44f9b33a2a3790b247d321a5a0970ed42e9b126ba262074017e6c63  /tmp/cv2-engine.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cv2-engine.tar.gz
          echo "eaf44618f4bac53d8d5ffe9fdf1175423f3261ece4efc4dce11dee0614df8b39  game_source/src/engine/data.ts" | sha256sum -c -
          echo "9db8660d73bed7080643e550d551505e083e3865e54d7990e3ef07b678fae5d6  game_source/src/engine/market.ts" | sha256sum -c -
          echo "51ea7f33ee125639ada23917f321dd85b27a6af9855e4b95c4bf22db4d7c5a6a  game_source/src/engine/poster.ts" | sha256sum -c -
          echo "55e689af4a76d52b86706a8d6e6fa4f47e5effbc840807cc25895f57368bdd62  game_source/src/engine/projects.ts" | sha256sum -c -
          echo "174502f483f8d54de4c5a2064295920a15f37ad295adbf092d772159ae5a0bf2  game_source/src/engine/rivals.ts" | sha256sum -c -
          echo "56aad92710eb565cee1321cd0cc5f4a3359aa222468405ea0f9953b481f78b5d  game_source/src/engine/state.ts" | sha256sum -c -

      - name: Commit recovered engine files and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/engine/data.ts \
                  game_source/src/engine/market.ts \
                  game_source/src/engine/poster.ts \
                  game_source/src/engine/projects.ts \
                  game_source/src/engine/rivals.ts \
                  game_source/src/engine/state.ts
          rm -rf .transfer
          rm -f .github/workflows/cast-v2-engine-import.yml
          git add -A
          git commit -m "Cast V2 transfer: remaining engine and state runtime"
          git push origin HEAD:design/cast-v2-canonical
