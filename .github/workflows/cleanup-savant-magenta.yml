name: Clean Production Savant Magenta Fringe

on:
  push:
    branches:
      - work/research-showrunner-auction-depth-pass
    paths:
      - .github/workflows/cleanup-savant-magenta.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/research-showrunner-auction-depth-pass
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Re-key existing Production Savant artwork
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          files = [
              Path('game_source/public/img/portrait-showrunner-savant.webp'),
              Path('game_source/public/img/sprite-showrunner-savant.webp'),
          ]

          def magenta_like(px, strong=False):
              r, g, b, a = px
              if a == 0:
                  return True
              # #FF00FF and its anti-aliased mixtures have both red and blue
              # materially above green. Production Savant has no intended
              # magenta clothing/details, but we still only remove colours
              # connected to the exterior transparent background.
              gap = 34 if strong else 18
              return (
                  r >= 115 and b >= 105 and g <= 205
                  and (r - g) >= gap and (b - g) >= gap
                  and abs(r - b) <= 155
              )

          def count_visible_magenta(im):
              return sum(1 for p in im.getdata() if p[3] > 0 and magenta_like(p))

          for path in files:
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              px = im.load()
              before = count_visible_magenta(im)

              # Flood-fill only exterior transparent/magenta-like pixels. This
              # strips the residual key colour without touching interior art.
              exterior = [[False] * w for _ in range(h)]
              q = deque()

              def candidate(x, y):
                  p = px[x, y]
                  return p[3] <= 8 or magenta_like(p)

              for x in range(w):
                  if candidate(x, 0): q.append((x, 0))
                  if candidate(x, h - 1): q.append((x, h - 1))
              for y in range(h):
                  if candidate(0, y): q.append((0, y))
                  if candidate(w - 1, y): q.append((w - 1, y))

              while q:
                  x, y = q.popleft()
                  if exterior[y][x] or not candidate(x, y):
                      continue
                  exterior[y][x] = True
                  if x: q.append((x - 1, y))
                  if x + 1 < w: q.append((x + 1, y))
                  if y: q.append((x, y - 1))
                  if y + 1 < h: q.append((x, y + 1))

              removed = 0
              for y in range(h):
                  for x in range(w):
                      if exterior[y][x]:
                          r, g, b, a = px[x, y]
                          if a:
                              removed += 1
                          px[x, y] = (0, 0, 0, 0)

              # Second pass: remove any remaining magenta-contaminated edge
              # pixels immediately touching transparency. Iterate a few times
              # so the old pink anti-alias halo cannot survive as a thin ring.
              edge_removed = 0
              for _ in range(4):
                  cut = []
                  for y in range(1, h - 1):
                      for x in range(1, w - 1):
                          p = px[x, y]
                          if p[3] == 0 or not magenta_like(p):
                              continue
                          if any(px[nx, ny][3] == 0 for nx, ny in (
                              (x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1),
                              (x - 1, y - 1), (x + 1, y - 1), (x - 1, y + 1), (x + 1, y + 1),
                          )):
                              cut.append((x, y))
                  if not cut:
                      break
                  for x, y in cut:
                      px[x, y] = (0, 0, 0, 0)
                  edge_removed += len(cut)

              # Clear hidden RGB under fully transparent pixels to prevent
              # resampling from reintroducing pink in browsers/GPU scaling.
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = px[x, y]
                      if a == 0 and (r or g or b):
                          px[x, y] = (0, 0, 0, 0)

              after = count_visible_magenta(im)
              if after:
                  # Remaining magenta is disconnected from the exterior and
                  # therefore part of the painted subject; report but preserve.
                  print(f'{path}: {w}x{h}; visible magenta {before} -> {after}; exterior removed={removed}; edge removed={edge_removed}; preserved interior={after}')
              else:
                  print(f'{path}: {w}x{h}; visible magenta {before} -> 0; exterior removed={removed}; edge removed={edge_removed}')

              # Lossless WebP keeps the exact existing artwork/geometry while
              # replacing only the transparency/keyed-edge data.
              im.save(path, 'WEBP', lossless=True, method=6, exact=True)
          PY

      - name: Verify alpha cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in [
              Path('game_source/public/img/portrait-showrunner-savant.webp'),
              Path('game_source/public/img/sprite-showrunner-savant.webp'),
          ]:
              im = Image.open(path).convert('RGBA')
              assert im.getbbox(), f'{path} became empty'
              alpha = im.getchannel('A')
              lo, hi = alpha.getextrema()
              assert lo == 0 and hi == 255, f'{path} lost expected transparency/opacity range: {(lo, hi)}'
              print(f'validated {path}: size={im.size}, alpha={lo}..{hi}, bytes={path.stat().st_size}')
          PY

      - name: Commit cleaned existing artwork and self-remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-savant-magenta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/public/img/portrait-showrunner-savant.webp \
                  game_source/public/img/sprite-showrunner-savant.webp \
                  .github/workflows/cleanup-savant-magenta.yml
          git diff --cached --quiet && exit 0
          git commit -m "Clean Production Savant magenta fringe [skip ci]"
          git push origin HEAD:work/research-showrunner-auction-depth-pass
