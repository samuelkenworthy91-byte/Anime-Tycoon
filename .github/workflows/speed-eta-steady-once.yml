name: Speed ETA Steady Hand CI

on:
  push:
    branches:
      - feature/kairosoft-production-pass
    paths:
      - .github/workflows/speed-eta-steady-once.yml

concurrency:
  group: speed-eta-steady-hand
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kairosoft-production-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Apply patch
        run: python tools/apply_speed_eta_fix.py

      - name: Clean generated imports
        run: python tools/fix_speed_eta_unused.py

      - name: Install dependencies
        working-directory: game_source
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Strict TypeScript check
        working-directory: game_source
        run: npx tsc -b

      - name: Run full tests
        working-directory: game_source
        run: npm test

      - name: Build production browser app
        working-directory: game_source
        run: npm run build

      - name: Commit validated fixes and clean scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/speed-eta-steady-once.yml tools/apply_speed_eta_fix.py tools/fix_speed_eta_unused.py
          git add game_source
          git commit -m "Fix live speed scaling and contract ETA; strengthen Steady Hand"
          git push origin HEAD:feature/kairosoft-production-pass
