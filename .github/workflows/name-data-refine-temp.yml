name: Refine international name pool

on:
  push:
    branches:
      - fix/posters-rd-names-2026-09-20
    paths:
      - ".github/workflows/name-data-refine-temp.yml"

permissions:
  contents: write

jobs:
  refine-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/posters-rd-names-2026-09-20
          fetch-depth: 0

      - name: Rebuild gender-locked 50-country pool
        run: |
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from collections import defaultdict

          def dl(name):
              url=f"https://github.com/onomaverse/datasets/releases/download/v2026.06/{name}"
              with urllib.request.urlopen(url, timeout=90) as r:
                  return r.read().decode("utf-8-sig")

          given=list(csv.DictReader(io.StringIO(dl("given-name-frequency.csv"))))
          surnames=list(csv.DictReader(io.StringIO(dl("surname-frequency.csv"))))
          gender_rows=list(csv.DictReader(io.StringIO(dl("name-gender-inference.csv"))))
          inference={}
          for row in gender_rows:
              try:
                  inference[row["name_id"]] = (float(row["p_male"]), float(row["p_female"]))
              except Exception:
                  pass

          preferred=["GB","IE","US","CA","AU","NZ","FR","DE","ES","IT","PT","NL","BE","SE","NO","DK","FI","PL","CZ","AT","CH","GR","RO","HU","BR","MX","AR","CO","CL","PE","ZA","NG","GH","KE","EG","MA","TR","IL","SA","AE","IN","PK","BD","JP","KR","CN","TW","PH","ID","MY","SG","TH","VN"]
          latin=re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿĀ-ž]")
          def usable(name):
              name=(name or "").strip()
              return bool(name) and bool(latin.search(name)) and len(name)<=40 and not any(ord(c)<32 for c in name)

          g=defaultdict(lambda:{"male":[],"female":[]})
          country={}
          for row in given:
              name=row["name"].strip()
              if not usable(name): continue
              code=row["country_code"].strip()
              country[code]=row["country_name"].strip()
              tag=(row.get("gender") or "").strip()
              pm,pf=inference.get(row.get("name_id",""),(0.5,0.5))
              bucket=None
              if tag=="M":
                  bucket="male"
              elif tag=="F":
                  bucket="female"
              elif tag=="M;F" or tag=="F;M":
                  if pm>=0.70:
                      bucket="male"
                  elif pf>=0.70:
                      bucket="female"
                  else:
                      continue
              else:
                  continue
              try: count=int(row["count"])
              except: count=0
              g[code][bucket].append((count,name))

          sn=defaultdict(list)
          for row in surnames:
              name=row["name"].strip()
              if not usable(name): continue
              code=row["country_code"].strip()
              country.setdefault(code,row["country_name"].strip())
              try: count=int(row["count"])
              except: count=0
              sn[code].append((count,name))

          def top(rows,n=100):
              seen=set(); out=[]
              for count,name in sorted(rows,key=lambda x:(-x[0],x[1].casefold())):
                  k=name.casefold()
                  if k in seen: continue
                  seen.add(k); out.append(name)
                  if len(out)==n: break
              return out

          eligible={}
          for code in set(g)&set(sn):
              male=top(g[code]["male"]); female=top(g[code]["female"]); family=top(sn[code])
              if min(len(male),len(female),len(family))>=100:
                  eligible[code]={"code":code,"country":country.get(code,code),"male":male[:100],"female":female[:100],"surnames":family[:100]}

          selected=[]; used=set()
          for code in preferred+sorted(eligible):
              if code in eligible and code not in used:
                  selected.append(eligible[code]); used.add(code)
              if len(selected)==50: break
          if len(selected)!=50:
              raise SystemExit(f"Only {len(selected)} countries qualify; eligible={sorted(eligible)}")

          payload={
            "source":{"name":"Onomaverse Names Datasets","version":"v2026.06","url":"https://onomaverse.com/datasets","license":"CC BY 4.0","attribution":"Names data from Onomaverse (https://onomaverse.com/datasets), licensed CC BY 4.0."},
            "countryCount":50,
            "perCountry":{"male":100,"female":100,"surnames":100},
            "genderRule":"First names are locked to source gender. M;F names are only assigned when Onomaverse global inference is >=70% for that gender; ambiguous names are excluded.",
            "countries":selected
          }
          with open("game_source/src/engine/generated/internationalNames.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":")); f.write("\n")
          print("Selected", ",".join(c["code"] for c in selected))
          print("GB male", next(c for c in selected if c["code"]=="GB")["male"][:10])
          print("GB female", next(c for c in selected if c["code"]=="GB")["female"][:10])
          PY

      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("game_source/src/engine/generated/internationalNames.json",encoding="utf-8"))
          assert len(p["countries"])==50
          assert all(len(c["male"])==100 and len(c["female"])==100 and len(c["surnames"])==100 for c in p["countries"])
          assert "David" not in p["countries"][0]["female"][:50]
          print("Validated strict-gender pool")
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/engine/generated/internationalNames.json
          git rm .github/workflows/name-data-refine-temp.yml
          git commit -m "Data: enforce gender-specific international first names"
          git push origin HEAD:fix/posters-rd-names-2026-09-20
