name: Verify annual auction implementation

on:
  push:
    branches:
      - work/auction-ceremony-hidden-arcs
    paths:
      - game_source/scripts/temp_fix_auction_v6.py
      - .github/workflows/auction-verify-v6.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auction-ceremony-hidden-arcs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply final auction compatibility patch
        run: python game_source/scripts/temp_fix_auction_v6.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run complete test suite
        working-directory: game_source
        run: npm test
      - name: Build production app
        working-directory: game_source
        run: npm run build
      - name: Commit verified game code and remove temporary verifier
        run: |
          rm -f game_source/scripts/temp_fix_auction_v6.py .github/workflows/auction-verify-v6.yml .auction-debug.txt .auction-ci-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize annual live IP auctions and hidden source arcs"
          git pull --rebase origin work/auction-ceremony-hidden-arcs
          git push origin HEAD:work/auction-ceremony-hidden-arcs
