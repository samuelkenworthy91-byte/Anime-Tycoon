name: Poster Research Names Validation

on:
  push:
    branches:
      - fix/posters-rd-names-2026-09-20
    paths:
      - "game_source/**"
      - ".github/workflows/fix-posters-rd-names-validation-temp.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Focused regression tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/international-names.test.ts src/engine/__tests__/research-scaling.test.ts src/engine/__tests__/arc-discovery.test.ts --reporter=verbose
      - name: Full test suite
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
