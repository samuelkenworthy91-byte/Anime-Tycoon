name: One-shot anti-snowball difficulty

on:
  push:
    branches: [work/anti-snowball-difficulty]

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/anti-snowball-difficulty
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Apply integrated difficulty pass
        run: python game_source/scripts/apply_anti_snowball.py

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build production browser bundle
        working-directory: game_source
        run: npm run build

      - name: Commit only verified anti-snowball changes
        shell: bash
        run: |
          rm -f game_source/scripts/apply_anti_snowball.py .github/workflows/one-shot-anti-snowball.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            game_source/src/engine/difficulty.ts \
            game_source/src/engine/scoring.ts \
            game_source/src/engine/market.ts \
            game_source/src/engine/rivals.ts \
            game_source/src/engine/state.ts \
            game_source/src/components/Rivals.tsx \
            game_source/src/engine/__tests__/rivals.test.ts \
            game_source/src/engine/__tests__/difficulty.test.ts \
            game_source/docs/DIFFICULTY_REBALANCE_V2.md \
            game_source/scripts/apply_anti_snowball.py \
            .github/workflows/one-shot-anti-snowball.yml
          git commit -m "Rebalance campaign against early studio snowball"
          git reset --hard HEAD
          git pull --rebase origin work/anti-snowball-difficulty
          git push origin HEAD:work/anti-snowball-difficulty
