name: Kairosoft Production Pass CI

on:
  push:
    branches:
      - feature/kairosoft-production-pass

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply migration
        run: |
          python tools/fix_apply_kairosoft.py
          python tools/apply_kairosoft_pass.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Strict TypeScript check
        working-directory: game_source
        run: npx tsc -b
      - name: Run full tests
        working-directory: game_source
        run: npm test
      - name: Build production browser app
        working-directory: game_source
        run: npm run build
      - name: Commit validated game files
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source
          git diff --cached --quiet || git commit -m "Rework production around Kairosoft-style live contributions"
          git push
