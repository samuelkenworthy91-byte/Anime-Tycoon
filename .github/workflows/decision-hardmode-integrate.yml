name: Decision Hardmode Integration

on:
  push:
    branches:
      - work/decision-events-hardmode
    paths:
      - 'game_source/scripts/apply-decision-hardmode.py'
      - 'game_source/scripts/fix-decision-hardmode-apply-v2.py'
      - 'game_source/scripts/fix-decision-hardmode-apply-v3.py'
      - 'game_source/scripts/post-tune-decision-hardmode.py'
      - 'game_source/src/engine/decisionEvents.ts'
      - 'game_source/src/engine/genreTargets.ts'
      - 'game_source/src/engine/projectActions.ts'
      - 'game_source/src/components/DecisionEventOverlay.tsx'
      - 'game_source/src/engine/__tests__/genre-targets-hardmode.test.ts'
      - '.github/workflows/decision-hardmode-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[decision-hardmode integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/decision-events-hardmode
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Harden integration patch and targets
        working-directory: game_source
        run: python3 scripts/fix-decision-hardmode-apply-v3.py

      - name: Apply integration
        id: integrate
        working-directory: game_source
        shell: bash
        run: |
          set +e
          python3 scripts/apply-decision-hardmode.py 2>&1 | tee decision-hardmode-integration.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload integration diagnostics
        if: steps.integrate.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: decision-hardmode-integration-log
          path: game_source/decision-hardmode-integration.log

      - name: Fail if integration failed
        if: steps.integrate.outputs.code != '0'
        run: exit 1

      - name: Tune integrated hardmode balance
        working-directory: game_source
        run: python3 scripts/post-tune-decision-hardmode.py

      - name: Install
        working-directory: game_source
        run: npm ci

      - name: Test
        working-directory: game_source
        run: npm test

      - name: Build
        working-directory: game_source
        run: npm run build

      - name: Commit integrated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/src game_source/scripts
          git commit -m 'Integrate decision events and hard-mode scoring [decision-hardmode integrated]' || exit 0
          git push origin HEAD:work/decision-events-hardmode
