name: Cast V2 medium docs import
on:
  push:
    branches: [design/cast-v2-canonical]
    paths: [.github/workflows/cast-v2-medium-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/cast-v2-canonical
          fetch-depth: 0
      - name: Reconstruct and verify recovered medium archive
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/cast-v2-medium/med-* | base64 -d > /tmp/medium.tar.gz
          echo 'f3062a03ba399c33b3f59c42c465ed3a10cba25c7ae6232d6c2a6c5b2be3703e  /tmp/medium.tar.gz' | sha256sum -c -
          rm -rf /tmp/cast-v2-medium-import
          mkdir -p /tmp/cast-v2-medium-import
          tar -xzf /tmp/medium.tar.gz -C /tmp/cast-v2-medium-import
          cp -a /tmp/cast-v2-medium-import/game_source/. game_source/
          test "$(git hash-object game_source/docs/cast-v2/CAST_V2_COVERAGE.md)" = "17165491aa90a634165ee5722571c92fa6487ed7"
          test "$(git hash-object game_source/docs/cast-v2/CAST_V2_MIGRATION_MAP.csv)" = "8eac3ace6027f5821fe95f965453050a0b7029e7"
          test "$(git hash-object game_source/docs/cast-v2/GENRE_V2_COMBOS.json)" = "1a8f7efdb6dc3e31fba8527011ddfba4551fd43f"
          test "$(git hash-object game_source/docs/cast-v2/evidence/visual_qc_decisions.json)" = "154f5cba9280872ebb0acf81b0accb4910a85976"
          test "$(git hash-object game_source/docs/cast-v2/evidence/visual_sheet_manifest.json)" = "29619a361b1f402290b0f926fd124b323108befb"
          test "$(git hash-object game_source/docs/cast-v2/evidence/visual_sheet_normalization.json)" = "f6fb8f80d8215a7befc8346747b60056fc4a0202"
          test "$(git hash-object game_source/docs/cast-v2/tools/build_v2.py)" = "c6b5a6aae31383a8435ee939f14ae9f8da8a0aa6"
      - name: Commit exact files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer/cast-v2-medium
          rm .github/workflows/cast-v2-medium-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/docs/cast-v2/CAST_V2_COVERAGE.md game_source/docs/cast-v2/CAST_V2_MIGRATION_MAP.csv game_source/docs/cast-v2/GENRE_V2_COMBOS.json game_source/docs/cast-v2/evidence/visual_qc_decisions.json game_source/docs/cast-v2/evidence/visual_sheet_manifest.json game_source/docs/cast-v2/evidence/visual_sheet_normalization.json game_source/docs/cast-v2/tools/build_v2.py .transfer/cast-v2-medium .github/workflows/cast-v2-medium-import.yml
          git commit -m 'Cast V2 transfer: coverage, migration and visual QC manifests'
          git push origin HEAD:design/cast-v2-canonical
