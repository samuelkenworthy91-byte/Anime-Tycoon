name: Patch cast multi-filter

on:
  push:
    branches:
      - work/final-awards-rival-posters
    paths:
      - game_source/scripts/patch-cast-multifilter.mjs
      - game_source/scripts/fix-cast-multifilter-patcher.mjs

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/final-awards-rival-posters
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Repair patch script escaping
        run: node game_source/scripts/fix-cast-multifilter-patcher.mjs

      - name: Apply cast multi-filter patch
        run: node game_source/scripts/patch-cast-multifilter.mjs

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Test
        working-directory: game_source
        run: npm test

      - name: Build
        working-directory: game_source
        run: npm run build

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/src/components/Create.tsx \
                  game_source/src/engine/castDisplayOrder.ts \
                  game_source/src/engine/__tests__/cast-display-filter.test.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Add Shonen/Shojo cast multi-filter support'
            git push origin HEAD:work/final-awards-rival-posters
          fi
