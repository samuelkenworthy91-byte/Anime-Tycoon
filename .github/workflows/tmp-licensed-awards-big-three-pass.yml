name: Temporary licensed IP awards Big Three pass

on:
  push:
    branches:
      - work/licensed-ip-awards-big-three-pass

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: contains(github.event.head_commit.message, '[apply-gameplay-pass]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/licensed-ip-awards-big-three-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply targeted source changes
        run: |
          python3 .github/scripts/apply_gameplay_pass.py
          python3 .github/scripts/fix_gameplay_pass_test.py
          python3 .github/scripts/final_gameplay_text_fix.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Focused regression tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/big-three.test.ts src/engine/__tests__/award-expectations.test.ts src/engine/__tests__/gameplay-pass-regressions.test.ts --reporter=verbose
      - name: Full test suite
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit validated gameplay pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Implement licensed IP awards and Big Three balance pass"
          git fetch origin work/licensed-ip-awards-big-three-pass
          git rebase origin/work/licensed-ip-awards-big-three-pass
          git push origin HEAD:work/licensed-ip-awards-big-three-pass
