, protagName:d.protagName, secondary:d.secondary, secondaryName:"S", pet:d.pet, petName:"P", villain:d.villain, villainName:"V" }, { total:39, revenue:5_000_000, fans:200_000, hallOfFame:true }, 10);\n    fr.popularity = 100; fr.fatigue = 0; fr.bigThree = false; fr.merchValue = merchValueOf(fr);\n    const normalRevenue = franchiseBoost(fr, d); const normalMerch = merchValueOf(fr);\n    fr.bigThree = true;\n    expect(franchiseBoost(fr, d)).toBeGreaterThan(normalRevenue * 1.35);\n    expect(merchValueOf(fr)).toBeGreaterThan(normalMerch * 1.5);\n  });\n});\n''')
