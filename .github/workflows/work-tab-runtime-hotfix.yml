name: Work Tab Runtime Hotfix

on:
  push:
    branches:
      - depth-clarity-overhaul
    paths:
      - ".github/workflows/work-tab-runtime-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Patch Work panel props and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game_source/src/components/Projects.tsx')
          s = p.read_text()
          replacements = [
            (
              '''export default function ProjectsPanel({\n  run,\n  onAssign,''',
              '''export default function ProjectsPanel({\n  run,\n  setRun,\n  onAssign,'''
            ),
            (
              '''  onScrap,\n  onContinueSeason,\n  onIntervention,''',
              '''  onScrap,\n  onContinueSeason,\n  onLicensed,\n  onIntervention,'''
            ),
            (
              '''  run: RunState;\n  onAssign: (projectId: string, staffId: string) => void;''',
              '''  run: RunState;\n  setRun: (fn: (r: RunState) => RunState) => void;\n  onAssign: (projectId: string, staffId: string) => void;'''
            ),
            (
              '''  /** greenlight the next season of an IP straight from its airing card */\n  onContinueSeason?: (franchiseKey: string) => void;\n  onIntervention: (projectId: string, interventionId: string) => void;''',
              '''  /** greenlight the next season of an IP straight from its airing card */\n  onContinueSeason?: (franchiseKey: string) => void;\n  onLicensed?: (ipId: string) => void;\n  onIntervention: (projectId: string, interventionId: string) => void;'''
            ),
          ]
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)
            else:
              assert new in s, f'ProjectsPanel anchor missing in both old and fixed form: {old[:50]!r}'
          p.write_text(s)

          t = Path('game_source/src/engine/__tests__/studio-slate-compat.test.ts')
          t.write_text('''import { createElement } from "react";\nimport { renderToStaticMarkup } from "react-dom/server";\nimport { describe, expect, it } from "vitest";\nimport StudioSlate from "../../components/StudioSlate";\nimport { initialRun, type RunState } from "../state";\n\nfunction installBrowserStorage() {\n  const store = new Map<string, string>();\n  Object.defineProperty(globalThis, "localStorage", {\n    configurable: true,\n    value: {\n      getItem: (key: string) => store.get(key) ?? null,\n      setItem: (key: string, value: string) => { store.set(key, String(value)); },\n      removeItem: (key: string) => { store.delete(key); },\n      clear: () => { store.clear(); },\n    },\n  });\n}\n\ndescribe("Work / StudioSlate runtime compatibility", () => {\n  it("opens Slate without crashing when optional/newer collections are absent", () => {\n    const fresh = initialRun("Legacy Work Save", "steady");\n    const legacy = {\n      ...fresh,\n      ipMarket: undefined,\n      contractJobs: undefined,\n      trainingJobs: undefined,\n      researchJobs: undefined,\n      slatePlans: undefined,\n    } as unknown as RunState;\n\n    expect(() => renderToStaticMarkup(createElement(StudioSlate, {\n      run: legacy,\n      setRun: () => {},\n      onOriginal: () => {},\n    }))).not.toThrow();\n  });\n\n  it("renders the complete Work panel without undefined prop references", async () => {\n    installBrowserStorage();\n    const { default: ProjectsPanel } = await import("../../components/Projects");\n    const run = initialRun("Work Runtime", "steady");\n    expect(() => renderToStaticMarkup(createElement(ProjectsPanel, {\n      run,\n      setRun: () => {},\n      onAssign: () => {},\n      onMilestone: () => {},\n      onShip: () => {},\n      onNewShow: () => {},\n      onDelegate: () => {},\n      onTakeOver: () => {},\n      onResume: () => {},\n      onScrap: () => {},\n      onContinueSeason: () => {},\n      onLicensed: () => {},\n      onIntervention: () => {},\n      onAppointPromise: () => {},\n      onAppointLead: () => {},\n    }))).not.toThrow();\n  });\n});\n''')
          PY
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run Work regression test
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/studio-slate-compat.test.ts
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/components/Projects.tsx game_source/src/engine/__tests__/studio-slate-compat.test.ts
          git commit -m "Fix Work tab runtime crash from missing panel props"
          git push origin HEAD:depth-clarity-overhaul
