name: Work Tab Runtime Hotfix

on:
  push:
    branches:
      - depth-clarity-overhaul
    paths:
      - ".github/workflows/work-tab-runtime-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Patch Work panel props and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game_source/src/components/Projects.tsx')
          s = p.read_text()

          old = '''export default function ProjectsPanel({
            run,
            onAssign,'''
          new = '''export default function ProjectsPanel({
            run,
            setRun,
            onAssign,'''
          assert old in s, 'ProjectsPanel destructuring anchor not found'
          s = s.replace(old, new, 1)

          old = '''  onScrap,
            onContinueSeason,
            onIntervention,'''
          new = '''  onScrap,
            onContinueSeason,
            onLicensed,
            onIntervention,'''
          assert old in s, 'ProjectsPanel onLicensed destructuring anchor not found'
          s = s.replace(old, new, 1)

          old = '''  run: RunState;
            onAssign: (projectId: string, staffId: string) => void;'''
          new = '''  run: RunState;
            setRun: (fn: (r: RunState) => RunState) => void;
            onAssign: (projectId: string, staffId: string) => void;'''
          assert old in s, 'ProjectsPanel setRun type anchor not found'
          s = s.replace(old, new, 1)

          old = '''  /** greenlight the next season of an IP straight from its airing card */
            onContinueSeason?: (franchiseKey: string) => void;
            onIntervention: (projectId: string, interventionId: string) => void;'''
          new = '''  /** greenlight the next season of an IP straight from its airing card */
            onContinueSeason?: (franchiseKey: string) => void;
            onLicensed?: (ipId: string) => void;
            onIntervention: (projectId: string, interventionId: string) => void;'''
          assert old in s, 'ProjectsPanel onLicensed type anchor not found'
          s = s.replace(old, new, 1)

          old = '''          p={p}
            run={run}
            onAssign={onAssign}'''
          new = '''          p={p}
            run={run}
            setRun={setRun}
            onAssign={onAssign}'''
          assert old in s, 'ProjectCard setRun prop anchor not found'
          s = s.replace(old, new, 1)

          old = '''          onScrap={onScrap}
            onContinueSeason={onContinueSeason}
            onIntervention={onIntervention}'''
          new = '''          onScrap={onScrap}
            onContinueSeason={onContinueSeason}
            onLicensed={onLicensed}
            onIntervention={onIntervention}'''
          assert old in s, 'ProjectCard onLicensed prop anchor not found'
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('game_source/src/engine/__tests__/studio-slate-compat.test.ts')
          ts = t.read_text()
          ts = ts.replace('import StudioSlate from "../../components/StudioSlate";', 'import StudioSlate from "../../components/StudioSlate";\nimport ProjectsPanel from "../../components/Projects";')
          insert = '''\n  it("renders the complete Work panel without undefined prop references", () => {\n    const run = initialRun("Work Runtime", "steady");\n    expect(() => renderToStaticMarkup(createElement(ProjectsPanel, {\n      run,\n      setRun: () => {},\n      onAssign: () => {},\n      onMilestone: () => {},\n      onShip: () => {},\n      onNewShow: () => {},\n      onDelegate: () => {},\n      onTakeOver: () => {},\n      onResume: () => {},\n      onScrap: () => {},\n      onContinueSeason: () => {},\n      onLicensed: () => {},\n      onIntervention: () => {},\n      onAppointPromise: () => {},\n      onAppointLead: () => {},\n    }))).not.toThrow();\n  });\n'''
          marker = '\n});\n'
          assert marker in ts, 'test closing marker missing'
          ts = ts.rsplit(marker, 1)[0] + insert + marker
          t.write_text(ts)
          PY
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run Work regression test
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/studio-slate-compat.test.ts
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/components/Projects.tsx game_source/src/engine/__tests__/studio-slate-compat.test.ts
          git commit -m "Fix Work tab runtime crash from missing panel props"
          git push origin HEAD:depth-clarity-overhaul
