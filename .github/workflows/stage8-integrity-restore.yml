name: Restore Stage 8 Big Three Integrity

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
    paths:
      - .github/workflows/stage8-integrity-restore.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: work/midgame-endgame-systems-pass
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Restore Stage 7 base and apply Stage 8 cadence only
        run: python game_source/scripts/restore-stage8-bigthree-integrity.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Validate Big Three integrity and Stage 8 audit
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/big-three.test.ts src/engine/__tests__/stage8-hardening.test.ts scripts/stage8-progression-audit.test.ts --reporter=verbose
      - name: Run full suite
        working-directory: game_source
        run: npm test
      - name: Build production web app
        working-directory: game_source
        run: npm run build
      - name: Commit integrity restoration
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/engine/bigThree.ts game_source/src/engine/__tests__/big-three.test.ts
          git commit -m "Preserve Stage 7 Big Three effects in Stage 8"
          git push origin HEAD:work/midgame-endgame-systems-pass
