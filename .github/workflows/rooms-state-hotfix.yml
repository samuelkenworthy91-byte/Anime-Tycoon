name: Rooms State Runtime Hotfix

on:
  push:
    branches:
      - depth-clarity-overhaul
    paths:
      - ".github/workflows/rooms-state-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply Rooms hotfix
        run: python .github/scripts/rooms_state_hotfix.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run Rooms regression tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/rooms-runtime-compat.test.ts src/engine/__tests__/facilities.test.ts
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/engine/facilities.ts game_source/src/engine/spending.ts game_source/src/engine/state.ts game_source/src/components/Facilities.tsx game_source/src/engine/__tests__/rooms-runtime-compat.test.ts
          git commit -m "Harden Rooms against malformed mid-save state"
          git push origin HEAD:depth-clarity-overhaul
