name: Rooms State Runtime Hotfix

on:
  push:
    branches:
      - depth-clarity-overhaul
    paths:
      - ".github/workflows/rooms-state-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Harden Rooms state and migration
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- facilities engine ----------
          p = Path('game_source/src/engine/facilities.ts')
          s = p.read_text()
          old = '''export const slotsUsed = (fac: Facilities): number => Object.values(fac).filter((t) => (t ?? 0) > 0).length;

export function nextTier(fac: Facilities, id: FacilityId): { tier: number; cost: number; rd: number } | null {
  const cur = fac[id] ?? 0;
  const def = facilityDef(id);
  if (cur >= def.tiers.length) return null;
  const t = def.tiers[cur];
  return { tier: cur + 1, cost: t.cost, rd: t.rd };
}

export function facilityUpkeep(fac: Facilities): number {
  let sum = 0;
  for (const [id, tier] of Object.entries(fac) as [FacilityId, number][]) {
    if (!tier) continue;
    sum += facilityDef(id).tiers[tier - 1].upkeep;
  }
  return sum;
}'''
          new = '''export const slotsUsed = (fac: Facilities | undefined): number => Object.values(fac ?? {}).filter((t) => typeof t === "number" && Number.isFinite(t) && t > 0).length;

export function nextTier(fac: Facilities | undefined, id: FacilityId): { tier: number; cost: number; rd: number } | null {
  const def = facilityDef(id);
  const raw = fac?.[id] ?? 0;
  const cur = typeof raw === "number" && Number.isFinite(raw)
    ? Math.max(0, Math.min(def.tiers.length, Math.floor(raw)))
    : 0;
  if (cur >= def.tiers.length) return null;
  const t = def.tiers[cur];
  return { tier: cur + 1, cost: t.cost, rd: t.rd };
}

export function facilityUpkeep(fac: Facilities | undefined): number {
  let sum = 0;
  for (const [idRaw, tierRaw] of Object.entries(fac ?? {})) {
    const def = FACILITY_DEFS.find((room) => room.id === idRaw);
    if (!def || typeof tierRaw !== "number" || !Number.isFinite(tierRaw)) continue;
    const tier = Math.max(0, Math.min(def.tiers.length, Math.floor(tierRaw)));
    if (tier <= 0) continue;
    const row = def.tiers[tier - 1];
    if (row) sum += row.upkeep;
  }
  return sum;
}'''
          assert old in s, 'facilities helper block not found'
          s = s.replace(old, new, 1)

          old = '''  const tier = (id: FacilityId) => fac[id] ?? 0;'''
          new = '''  const tier = (id: FacilityId) => {
    const def = facilityDef(id);
    const raw = fac[id] ?? 0;
    return typeof raw === "number" && Number.isFinite(raw)
      ? Math.max(0, Math.min(def.tiers.length, Math.floor(raw)))
      : 0;
  };'''
          assert old in s, 'facilityFX tier helper not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- production capability history ----------
          p = Path('game_source/src/engine/spending.ts')
          s = p.read_text()
          old = '''function capabilityForSpendLabel(label: string): ProductionCapabilityId | null {
  const def = BASE_INTERVENTIONS.find((d) => d.capability && label.startsWith(d.name));
  return def?.capability ?? null;
}

export function capabilitySpend(run: Pick<RunState, "strategicSpend">, id: ProductionCapabilityId): number {
  return (run.strategicSpend ?? []).reduce((sum, spend) => capabilityForSpendLabel(spend.label) === id ? sum + Math.max(0, spend.amount) : sum, 0);
}'''
          new = '''function capabilityForSpendLabel(label: unknown): ProductionCapabilityId | null {
  if (typeof label !== "string") return null;
  const def = BASE_INTERVENTIONS.find((d) => d.capability && label.startsWith(d.name));
  return def?.capability ?? null;
}

export function capabilitySpend(run: Pick<RunState, "strategicSpend">, id: ProductionCapabilityId): number {
  const history = Array.isArray(run.strategicSpend) ? run.strategicSpend : [];
  return history.reduce((sum, spend) => {
    if (!spend || typeof spend !== "object") return sum;
    if (capabilityForSpendLabel((spend as { label?: unknown }).label) !== id) return sum;
    const amount = (spend as { amount?: unknown }).amount;
    return sum + (typeof amount === "number" && Number.isFinite(amount) ? Math.max(0, amount) : 0);
  }, 0);
}'''
          assert old in s, 'capability spend block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- save migration ----------
          p = Path('game_source/src/engine/state.ts')
          s = p.read_text()
          old = '''import {
  MAX_TIER,
  facilityDef,'''
          new = '''import {
  MAX_TIER,
  FACILITY_DEFS,
  facilityDef,'''
          assert old in s, 'facilities import anchor not found'
          s = s.replace(old, new, 1)

          anchor = '''/** bring an older save up to the current shape (additive, non-destructive) */
export function migrateRun(raw: unknown): RunState {'''
          helper = '''function migrateFacilities(raw: unknown): Facilities {
  const next: Facilities = {};
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return next;
  for (const def of FACILITY_DEFS) {
    const value = (raw as Record<string, unknown>)[def.id];
    if (typeof value !== "number" || !Number.isFinite(value)) continue;
    const tier = Math.max(0, Math.min(def.tiers.length, Math.floor(value)));
    if (tier > 0) next[def.id] = tier;
  }
  return next;
}

function migrateStrategicSpend(raw: unknown, fallbackWeek: number): RunState["strategicSpend"] {
  if (!Array.isArray(raw)) return [];
  return raw.flatMap((entry, index) => {
    if (!entry || typeof entry !== "object") return [];
    const value = entry as Record<string, unknown>;
    const label = typeof value.label === "string" ? value.label.trim() : "";
    if (!label) return [];
    const week = typeof value.week === "number" && Number.isFinite(value.week)
      ? Math.max(0, Math.floor(value.week))
      : Math.max(0, Math.floor(fallbackWeek));
    const amount = typeof value.amount === "number" && Number.isFinite(value.amount) ? value.amount : 0;
    const id = typeof value.id === "string" && value.id.trim()
      ? value.id
      : `legacy_spend_${week}_${index}`;
    const projectId = typeof value.projectId === "string" && value.projectId.trim() ? value.projectId : undefined;
    return [{ id, label: label.slice(0, 160), amount, week, ...(projectId ? { projectId } : {}) }];
  });
}

/** bring an older save up to the current shape (additive, non-destructive) */
export function migrateRun(raw: unknown): RunState {'''
          assert anchor in s, 'migrateRun anchor not found'
          s = s.replace(anchor, helper, 1)

          old = '''    facilities: r.facilities && typeof r.facilities === "object" ? r.facilities : {},'''
          new = '''    facilities: migrateFacilities((r as { facilities?: unknown }).facilities),'''
          assert old in s, 'facilities migration line not found'
          s = s.replace(old, new, 1)

          old = '''    strategicSpend: Array.isArray(r.strategicSpend) ? r.strategicSpend : [],'''
          new = '''    strategicSpend: migrateStrategicSpend((r as { strategicSpend?: unknown }).strategicSpend, r.week ?? 0),'''
          assert old in s, 'strategicSpend migration line not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- Rooms component ----------
          p = Path('game_source/src/components/Facilities.tsx')
          s = p.read_text()
          old = '''  const tier = run.facilities[def.id] ?? 0;
  const owned = tier > 0;
  const nx = nextTier(run.facilities, def.id);'''
          new = '''  const facilities = run.facilities ?? {};
  const rawTier = facilities[def.id] ?? 0;
  const tier = typeof rawTier === "number" && Number.isFinite(rawTier)
    ? Math.max(0, Math.min(def.tiers.length, Math.floor(rawTier)))
    : 0;
  const owned = tier > 0;
  const nx = nextTier(facilities, def.id);'''
          assert old in s, 'FacilityCard tier block not found'
          s = s.replace(old, new, 1)

          old = '''  const used = slotsUsed(run.facilities);
  const total = officeSlots(run);
  const upkeep = facilityUpkeep(run.facilities);
  const owned = FACILITY_DEFS.filter((d) => (run.facilities[d.id] ?? 0) > 0);
  const buildable = FACILITY_DEFS.filter((d) => (run.facilities[d.id] ?? 0) === 0);'''
          new = '''  const facilities = run.facilities ?? {};
  const used = slotsUsed(facilities);
  const total = officeSlots(run);
  const upkeep = facilityUpkeep(facilities);
  const owned = FACILITY_DEFS.filter((d) => {
    const tier = facilities[d.id];
    return typeof tier === "number" && Number.isFinite(tier) && tier > 0;
  });
  const buildable = FACILITY_DEFS.filter((d) => {
    const tier = facilities[d.id];
    return !(typeof tier === "number" && Number.isFinite(tier) && tier > 0);
  });'''
          assert old in s, 'FacilitiesPanel summary block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- regression test ----------
          t = Path('game_source/src/engine/__tests__/rooms-runtime-compat.test.ts')
          t.write_text('''import { createElement } from "react";\nimport { renderToStaticMarkup } from "react-dom/server";\nimport { describe, expect, it } from "vitest";\nimport { initialRun, migrateRun } from "../state";\nimport { facilityUpkeep, slotsUsed } from "../facilities";\nimport { productionCapabilities } from "../spending";\n\nfunction installBrowserStorage() {\n  const store = new Map<string, string>();\n  Object.defineProperty(globalThis, "localStorage", {\n    configurable: true,\n    value: {\n      getItem: (key: string) => store.get(key) ?? null,\n      setItem: (key: string, value: string) => { store.set(key, String(value)); },\n      removeItem: (key: string) => { store.delete(key); },\n      clear: () => { store.clear(); },\n    },\n  });\n}\n\ndescribe("Rooms runtime compatibility", () => {\n  it("repairs malformed later-career facilities and strategic-spend history", async () => {\n    installBrowserStorage();\n    const raw: any = initialRun("Rooms Recovery", "steady");\n    raw.week = 173;\n    raw.facilities = { writers: 99, animation: 2, obsolete_room: 1, recording: -4 };\n    raw.strategicSpend = [\n      null,\n      { id: "bad-no-label", amount: 45000, week: 100 },\n      { id: "bad-label", label: null, amount: 20000, week: 101 },\n      { id: "bad-amount", label: "Extra Animation Pass", amount: "65000", week: 102 },\n      { id: "good", label: "Extra Animation Pass · Prestige", amount: 500000, week: 103 },\n    ];\n\n    const run = migrateRun(raw);\n    expect(run.facilities.writers).toBe(3);\n    expect(run.facilities.animation).toBe(2);\n    expect((run.facilities as any).obsolete_room).toBeUndefined();\n    expect(run.facilities.recording).toBeUndefined();\n    expect(slotsUsed(run.facilities)).toBe(2);\n    expect(Number.isFinite(facilityUpkeep(run.facilities))).toBe(true);\n    expect(productionCapabilities(run).find((x) => x.id === "animation")?.spend).toBe(500000);\n\n    const { default: FacilitiesPanel } = await import("../../components/Facilities");\n    expect(() => renderToStaticMarkup(createElement(FacilitiesPanel, {\n      run,\n      onBuy: () => {},\n    }))).not.toThrow();\n  });\n\n  it("does not crash capability history when handed malformed entries before migration", () => {\n    const run: any = initialRun("Raw Recovery", "steady");\n    run.strategicSpend = [null, {}, { label: undefined, amount: 1000 }, { label: "Writing Room Overhaul", amount: NaN }];\n    expect(() => productionCapabilities(run)).not.toThrow();\n  });\n});\n''')
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run Rooms regression tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/rooms-runtime-compat.test.ts src/engine/__tests__/facilities.test.ts

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Production build
        working-directory: game_source
        run: npm run build

      - name: Commit hotfix
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/engine/facilities.ts game_source/src/engine/spending.ts game_source/src/engine/state.ts game_source/src/components/Facilities.tsx game_source/src/engine/__tests__/rooms-runtime-compat.test.ts
          git commit -m "Harden Rooms against malformed mid-save state"
          git push origin HEAD:depth-clarity-overhaul
