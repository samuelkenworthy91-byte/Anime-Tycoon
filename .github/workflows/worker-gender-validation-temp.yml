name: Worker gender validation
on:
  push:
    branches: [fix/worker-gender-sprite-pass-2026-09-20]
    paths:
      - "game_source/**"
      - ".github/workflows/worker-gender-validation-temp.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Focused worker/name tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/worker-sprite-gender.test.ts src/engine/__tests__/international-names.test.ts src/engine/__tests__/recruitment-ads.test.ts src/engine/__tests__/worker-easter-egg.test.ts --reporter=verbose
      - name: Full tests
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
