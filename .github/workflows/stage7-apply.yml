name: Apply Stage 7 Big Three Endgame

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
    paths:
      - .github/workflows/stage7-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/midgame-endgame-systems-pass
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply Stage 7 patches
        run: python game_source/scripts/apply-stage7.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Validate Stage 7 focused tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/big-three.test.ts src/engine/__tests__/ip-renewal.test.ts src/engine/__tests__/production-investment.test.ts src/engine/__tests__/studio-specialisation.test.ts --reporter=verbose
      - name: Run full suite
        working-directory: game_source
        run: npm test
      - name: Build production web app
        working-directory: game_source
        run: npm run build
      - name: Commit Stage 7
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add \
            game_source/src/engine/bigThree.ts \
            game_source/src/components/BigThreeBoard.tsx \
            game_source/src/components/BigThreeReveal.tsx \
            game_source/src/engine/__tests__/big-three.test.ts \
            game_source/src/engine/state.ts \
            game_source/src/App.tsx \
            game_source/src/components/Office.tsx \
            game_source/src/engine/franchise.ts \
            game_source/src/engine/ip.ts \
            game_source/src/engine/ipRenewal.ts \
            game_source/src/engine/rivalPosters.ts \
            game_source/src/engine/presentation.ts
          git commit -m "Add Year 6 Big Three endgame"
          git push origin HEAD:work/midgame-endgame-systems-pass
