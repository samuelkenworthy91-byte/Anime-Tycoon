name: Apply Stage 6 Studio Specialisation

on:
  push:
    branches:
      - work/midgame-endgame-systems-pass
    paths:
      - .github/workflows/stage6-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/midgame-endgame-systems-pass
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply Stage 6 patches
        run: python game_source/scripts/apply-stage6.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Validate Stage 6 focused tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/studio-specialisation.test.ts src/engine/__tests__/production-investment.test.ts src/engine/__tests__/ip-renewal.test.ts --reporter=verbose
      - name: Run full suite
        working-directory: game_source
        run: npm test
      - name: Build production web app
        working-directory: game_source
        run: npm run build
      - name: Commit Stage 6
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source/src/engine/state.ts game_source/src/engine/spending.ts game_source/src/components/Projects.tsx game_source/src/components/Ship.tsx game_source/src/components/Rivals.tsx .github/workflows/midgame-endgame-validation.yml
          git commit -m "Add studio signature-genre specialisation"
          git push origin HEAD:work/midgame-endgame-systems-pass
# retry after neutral worker fixture
