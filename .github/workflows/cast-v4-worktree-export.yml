name: Cast V4 Worktree Export

on:
  push:
    branches:
      - work/cast-v4-runtime-integration

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[cast-v4-audit-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate conservative Cast V4 source audit
        shell: bash
        run: |
          set +e
          python game_source/scripts/audit-cast-v4-source.py
          status=$?
          echo "audit_status=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Commit audit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/docs/cast-v4/CAST_V4_SOURCE_AUDIT.csv game_source/docs/cast-v4/CAST_V4_SOURCE_AUDIT_SUMMARY.md
          if git diff --cached --quiet; then
            echo "No audit output changes to commit"
          else
            git commit -m "audit: record Cast V4 source blocker [cast-v4-audit-output]"
            git push origin HEAD:work/cast-v4-runtime-integration
          fi

      - name: Upload Cast V4 staging pool
        uses: actions/upload-artifact@v4
        with:
          name: cast-v4-staging
          path: game_source/art_src/cast_v4_upload_staging
          retention-days: 1
          if-no-files-found: error

      - name: Upload existing runtime portrait reference
        uses: actions/upload-artifact@v4
        with:
          name: cast-v2-runtime-reference
          path: game_source/public/cast/v2
          retention-days: 1
          if-no-files-found: error

      - name: Upload code and canonical content slice
        uses: actions/upload-artifact@v4
        with:
          name: cast-v4-code-slice
          path: |
            game_source/package.json
            game_source/package-lock.json
            game_source/tsconfig*.json
            game_source/vite.config.*
            game_source/vitest.config.*
            game_source/src
            game_source/scripts
            game_source/docs/content-v3
            game_source/docs/cast-v4
          retention-days: 1
          if-no-files-found: warn
