name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
      - work/casting-catalog-rebuild
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Rename playtest APK
        run: cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Casting-Catalog-V7-Playtest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-casting-catalog-v7-test-apk
          path: Anime-Runner-Casting-Catalog-V7-Playtest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct GitHub playtest APK
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='casting-catalog-v7-playtest'
          APK='Anime-Runner-Casting-Catalog-V7-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner Casting Catalog V7 Playtest' \
            --notes 'Branch-only Android playtest build with hard portrait-signature preservation, exact 435-pair coverage, and auction-winner-only IP awards eligibility with canonical posters. Main is untouched.'