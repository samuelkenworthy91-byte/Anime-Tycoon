name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
      - work/casting-catalog-rebuild
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Apply Casting Catalog V7 source migration
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        working-directory: game_source
        run: node scripts/migrate-casting-catalog-v7.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Commit clean catalog source migration
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game_source/src/engine/state.ts \
            game_source/src/engine/data.ts \
            game_source/scripts/content-packs/genre30-pack.mjs \
            game_source/scripts/verify-cast-wiring.mjs \
            game_source/scripts/verify-built-cast.mjs
          if git diff --cached --quiet; then
            echo 'Casting Catalog V7 source already migrated'
          else
            git commit -m 'Remove legacy casting wiring from source pipeline'
            git push origin HEAD:work/casting-catalog-rebuild
          fi

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-casting-catalog-v7-test-apk
          path: game_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
