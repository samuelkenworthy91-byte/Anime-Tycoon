name: Build Android APK

# Playtest rebuild marker: scroll + expanded pun-title update
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0608d-anime-tycoon
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-tycoon-debug-apk
          path: game_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
