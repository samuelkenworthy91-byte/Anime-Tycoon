name: Build Android APK
# Fresh-build trigger: main and active playtest branches.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - depth-clarity-overhaul
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
      - work/casting-catalog-rebuild
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Rename final APK
        run: |
          if [ "$GITHUB_REF_NAME" = "depth-clarity-overhaul" ]; then
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Depth-Clarity-Playtest.apk
          else
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Main-Playtest.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-${{ github.ref_name }}-playtest-apk
          path: Anime-Runner-*-Playtest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct GitHub main APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='main-playtest'
          APK='Anime-Runner-Main-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner Main Playtest' \
            --notes "Android debug APK built from main at ${BUILT_SHA}."

      - name: Publish direct GitHub Depth & Clarity APK
        if: github.ref == 'refs/heads/depth-clarity-overhaul'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='depth-clarity-playtest'
          APK='Anime-Runner-Depth-Clarity-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner — Depth & Clarity Playtest' \
            --notes "Android debug APK built from depth-clarity-overhaul at ${BUILT_SHA}. Includes the approved neon title-screen artwork and onboarding overhaul."
