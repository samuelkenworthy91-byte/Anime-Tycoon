name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply awards ceremony polish pass
        if: github.ref == 'refs/heads/work/final-awards-rival-posters'
        run: |
          node .github/scripts/fix-awards-polish-script.mjs
          node .github/scripts/awards-polish-pass.mjs

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Commit validated awards polish
        if: github.ref == 'refs/heads/work/final-awards-rival-posters'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game_source/src/engine/awards.ts \
                  game_source/src/engine/state.ts \
                  game_source/src/engine/playtestSeed.ts \
                  game_source/src/engine/audio.ts \
                  game_source/src/engine/rivals.ts \
                  game_source/src/components/AwardsCeremony.tsx \
                  game_source/src/components/awardsCeremony.css \
                  game_source/src/engine/__tests__/awards-polish.test.ts
          if git diff --cached --quiet; then
            echo 'No application changes needed.'
          else
            git commit -m 'Polish awards ceremony presentation and audio'
            git push origin HEAD:work/final-awards-rival-posters
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-awards-polish-playtest-apk
          path: game_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
