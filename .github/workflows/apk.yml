name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
      - work/casting-catalog-rebuild
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Apply Casting Catalog V7 source migration
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        working-directory: game_source
        run: node scripts/migrate-casting-catalog-v7.mjs

      - name: Align portrait genres and auction-IP awards posters
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        working-directory: game_source
        run: node scripts/migrate-casting-visual-awards.mjs

      - name: Enforce portrait signatures and auction award ownership
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        working-directory: game_source
        run: node scripts/migrate-casting-awards-hardening.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Commit clean catalog source migration
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game_source/src/engine/state.ts \
            game_source/src/engine/data.ts \
            game_source/src/engine/castCatalog.ts \
            game_source/src/engine/awards.ts \
            game_source/src/engine/ip.ts \
            game_source/src/engine/__tests__/casting-awards-hardening.test.ts \
            game_source/src/components/AwardsCeremony.tsx \
            game_source/scripts/content-packs/genre30-pack.mjs \
            game_source/scripts/verify-cast-wiring.mjs \
            game_source/scripts/verify-built-cast.mjs
          if git diff --cached --quiet; then
            echo 'Casting Catalog V7 source already migrated and hardened'
          else
            git commit -m 'Harden casting signatures and auction award ownership'
            git push origin HEAD:work/casting-catalog-rebuild
          fi

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-casting-catalog-v7-test-apk
          path: game_source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct GitHub playtest APK
        if: github.ref == 'refs/heads/work/casting-catalog-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='casting-catalog-v7-playtest'
          APK='game_source/android/app/build/outputs/apk/debug/app-debug.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK#Anime-Runner-Casting-Catalog-V7-Playtest.apk" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner Casting Catalog V7 Playtest' \
            --notes 'Branch-only Android playtest build with hard portrait-signature preservation, exact 435-pair coverage, and auction-winner-only IP awards eligibility with canonical posters. Main is untouched.'