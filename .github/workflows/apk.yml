name: Build Android APK
# Fresh-build trigger: main and active playtest branches. Arcball 1.0 main integration build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bugfix/arcball-rooms-work-cleanup
      - depth-clarity-overhaul
      - player-value-variety-pass
      - showrunner-expansion-2026-09-27
      - arcball-v1
      - arena/01a0615b-anime-tycoon
      - arena/01a0759f-anime-tycoon
      - work/final-awards-rival-posters
      - work/casting-catalog-rebuild
    paths:
      - "game_source/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: TypeScript strict typecheck
        working-directory: game_source
        run: npx tsc -p tsconfig.runtime.json

      - name: Run test suite
        working-directory: game_source
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: game_source
        run: npm run apk:sync

      - name: Make Gradle wrapper executable
        working-directory: game_source
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game_source/android
        run: ./gradlew assembleDebug

      - name: Rename final APK
        run: |
          if [ "$GITHUB_REF_NAME" = "depth-clarity-overhaul" ]; then
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Depth-Clarity-Final-Playtest.apk
          elif [ "$GITHUB_REF_NAME" = "arcball-v1" ]; then
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Arcball.apk
          elif [ "$GITHUB_REF_NAME" = "bugfix/arcball-rooms-work-cleanup" ]; then
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Crash-Audit-Playtest.apk
          else
            cp game_source/android/app/build/outputs/apk/debug/app-debug.apk Anime-Runner-Main-Playtest.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-runner-playtest-${{ github.run_id }}
          path: |
            Anime-Runner-*-Playtest.apk
            Anime-Runner-Arcball.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct GitHub Arcball APK
        if: github.ref == 'refs/heads/arcball-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='arcball-v1'
          APK='Anime-Runner-Arcball.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete 'arcball-playtest' --cleanup-tag -y || true
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner — Arcball 1.0 Branch' \
            --notes "Full Anime Runner game build with Arcball integrated. Uses the normal app identity and normal career/save flow; no seeded playtest career."

      - name: Publish direct GitHub main APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='main-playtest'
          APK='Anime-Runner-Main-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner Main Playtest' \
            --notes "Android debug APK built from main at ${BUILT_SHA}."

      - name: Publish direct GitHub Depth & Clarity APK
        if: github.ref == 'refs/heads/depth-clarity-overhaul'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='depth-clarity-playtest'
          APK='Anime-Runner-Depth-Clarity-Final-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner — Depth & Clarity Final Playtest' \
            --notes "Final validated Android playtest APK built from depth-clarity-overhaul at ${BUILT_SHA}. Depth & Clarity final validation, production web build and Pixel 9a Slate smoke are green. Main remains untouched."


      - name: Publish direct GitHub Player Value Variety APK
        if: github.ref == 'refs/heads/player-value-variety-pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='player-value-variety-pass-playtest'
          APK='Anime-Runner-Main-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner — Player Value Variety Playtest' \
            --notes "Android debug APK built from player-value-variety-pass at ${BUILT_SHA}."

      - name: Publish direct GitHub Crash Audit APK
        if: github.ref == 'refs/heads/bugfix/arcball-rooms-work-cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='crash-audit-playtest'
          APK='Anime-Runner-Crash-Audit-Playtest.apk'
          BUILT_SHA="$(git rev-parse HEAD)"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" \
            "$APK" \
            --target "$BUILT_SHA" \
            --title 'Anime Runner — Crash Audit Playtest' \
            --notes "Bug-fix playtest APK after Arcball, Rooms, Work and runtime crash audit at ${BUILT_SHA}."
