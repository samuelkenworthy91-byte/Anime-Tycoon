name: One-shot corrected 100 IP finalisation

on:
  push:
    branches: [work/ip-100-finalize]
    paths: [.github/workflows/one-shot-ip-100-fix.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ip-100-finalize
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply corrected catalogue expansion
        run: python game_source/scripts/temp_finalize_ip_100.py
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Validate all 100 poster assets
        working-directory: game_source
        run: npm run auction-ip:validate-posters
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Build browser production bundle
        working-directory: game_source
        run: npm run build
      - name: Commit verified expansion
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-ip-100-finalize.yml .github/workflows/one-shot-ip-100-fix.yml game_source/scripts/temp_finalize_ip_100.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Activate all 100 auction IPs and hidden arcs'
          git push origin HEAD:work/ip-100-finalize
