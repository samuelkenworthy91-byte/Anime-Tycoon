name: Validate contract quick best team fix

on:
  push:
    branches:
      - work/contract-quick-best-main-fix
    paths:
      - ".github/workflows/contract-quick-best-fix.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/contract-quick-best-main-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Patch quick best team into contract cards
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('game_source/src/App.tsx')
          s = app.read_text()
          old = s
          s = s.replace(
              '  startBlockReason,\n  startContractAssignment,',
              '  contractSelectionDailyOutputEstimate,\n  staffBusyReason,\n  startBlockReason,\n  startContractAssignment,',
              1,
          )
          anchor = '''  const takeContract = useCallback((c: Contract) => {\n    sfx.select();\n    setContract(c);\n    setScreen("contract");\n  }, []);\n\n'''
          insert = anchor + '''  const quickBestContract = useCallback((c: Contract) => {\n    if (!run) return;\n    const runnerBusy = run.contractJobs.some((job) => job.showrunner);\n    const available: ({ kind: "staff"; id: string } | { kind: "runner" })[] = run.staff\n      .filter((staff) => !staffBusyReason(run, staff.id))\n      .map((staff) => ({ kind: "staff" as const, id: staff.id }));\n    if (!runnerBusy) available.push({ kind: "runner" });\n\n    type Candidate = { staffIds: string[]; showrunner: boolean; rate: number; size: number; meets: boolean };\n    let best: Candidate | null = null;\n    const consider = (picked: typeof available) => {\n      const staffIds = picked\n        .filter((seat): seat is { kind: "staff"; id: string } => seat.kind === "staff")\n        .map((seat) => seat.id);\n      const showrunner = picked.some((seat) => seat.kind === "runner");\n      const rate = contractSelectionDailyOutputEstimate(run, c, staffIds, showrunner);\n      const candidate: Candidate = {\n        staffIds,\n        showrunner,\n        rate,\n        size: picked.length,\n        meets: rate * c.weeks * 7 >= c.target,\n      };\n      if (\n        !best ||\n        (candidate.meets && !best.meets) ||\n        (candidate.meets === best.meets && candidate.meets && candidate.size < best.size) ||\n        (candidate.meets === best.meets && (!candidate.meets || candidate.size === best.size) && candidate.rate > best.rate)\n      ) best = candidate;\n    };\n\n    for (let a = 0; a < available.length; a += 1) {\n      consider([available[a]]);\n      for (let b = a + 1; b < available.length; b += 1) {\n        consider([available[a], available[b]]);\n        for (let d = b + 1; d < available.length; d += 1) consider([available[a], available[b], available[d]]);\n      }\n    }\n\n    if (!best) {\n      sfx.back();\n      return;\n    }\n    const next = startContractAssignment(run, c, best.staffIds, best.showrunner);\n    if (!next) {\n      sfx.back();\n      return;\n    }\n    sfx.select();\n    setRun(next);\n  }, [run]);\n\n'''
          if anchor not in s:
              raise SystemExit('takeContract anchor not found')
          s = s.replace(anchor, insert, 1)
          office_prop = '            onContract={takeContract}\n'
          if office_prop not in s:
              raise SystemExit('Office onContract prop anchor not found')
          s = s.replace(office_prop, office_prop + '            onQuickContract={quickBestContract}\n', 1)
          if s == old:
              raise SystemExit('App.tsx was not changed')
          app.write_text(s)

          office = Path('game_source/src/components/Office.tsx')
          s = office.read_text()
          old = s
          s = s.replace(
              '  onContract,\n  onCommission,',
              '  onContract,\n  onQuickContract,\n  onCommission,',
              1,
          )
          s = s.replace(
              '  onContract: (c: Contract) => void;\n  onCommission: (c: Commission) => void;',
              '  onContract: (c: Contract) => void;\n  onQuickContract: (c: Contract) => void;\n  onCommission: (c: Commission) => void;',
              1,
          )
          old_button = '''                <Btn variant="cyan" className="!px-3 !py-1.5 text-xs" onClick={() => onContract(c)}>\n                  TAKE\n                </Btn>'''
          new_button = '''                <div className="flex shrink-0 flex-col gap-1">\n                  <Btn variant="cyan" className="!px-3 !py-1.5 text-xs" onClick={() => onContract(c)}>\n                    TAKE\n                  </Btn>\n                  <Btn variant="ghost" className="!px-2 !py-1 text-[8px] leading-tight" onClick={() => { sfx.click(); setModal(null); onQuickContract(c); }}>\n                    <Sparkles size={10} /> <span>QUICK BEST<br/>TEAM</span>\n                  </Btn>\n                </div>'''
          if old_button not in s:
              raise SystemExit('contract TAKE button anchor not found')
          s = s.replace(old_button, new_button, 1)
          if s == old:
              raise SystemExit('Office.tsx was not changed')
          office.write_text(s)
          PY

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Production build
        working-directory: game_source
        run: npm run build

      - name: Commit validated source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/App.tsx game_source/src/components/Office.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Expose contract Quick Best Team from job cards"
            git push origin HEAD:work/contract-quick-best-main-fix
          fi
