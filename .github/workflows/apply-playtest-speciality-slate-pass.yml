name: Apply playtest specialty slate pass

on:
  push:
    branches:
      - depth-clarity-overhaul
    paths:
      - "game_source/scripts/apply-playtest-speciality-slate-pass.mjs"
      - ".github/workflows/apply-playtest-speciality-slate-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: depth-clarity-overhaul
          fetch-depth: 0
      - name: Apply exact source patches
        run: node game_source/scripts/apply-playtest-speciality-slate-pass.mjs
      - name: Commit patched source and remove one-shot hook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm game_source/scripts/apply-playtest-speciality-slate-pass.mjs .github/workflows/apply-playtest-speciality-slate-pass.yml
          git add -A
          git commit -m 'Playtest pass: tactile quick start, specialty scoring and prepared slate'
          git push origin HEAD:depth-clarity-overhaul
