name: Temp auction verification fix v5

on:
  push:
    branches: [work/auction-ceremony-hidden-arcs]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auction-ceremony-hidden-arcs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Patch compatibility and meaningful economy expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ip=Path('game_source/src/engine/ip.ts')
          s=ip.read_text(encoding='utf-8')
          s=s.replace('const rightsScale: Record<IPRarity, number> = { cult: .35, emerging: .6, recognised: 1.2, premium: 2.5, legendary: 6 };','const rightsScale: Record<IPRarity, number> = { cult: .12, emerging: .38, recognised: 1.2, premium: 2.5, legendary: 6 };')
          old='''  let market={...m,auctions:m.auctions.map(a=>({...a,bids:[...a.bids]})),owned:{...m.owned},rivalOwned:{...m.rivalOwned},history:[...m.history]}; const notices:string[]=[];
  market.auctions=market.auctions.map(a=>a); for(const a of market.auctions.filter(a=>!a.resolved&&run.week>=a.closesWeek)){market=resolveForAI(market,a,world,rng);const ip=ipById(a.ipId);notices.push(`${ip?.title??"The IP"} auction closed.`);}'''
          new='''  let market={...m,auctions:m.auctions.map(a=>({...a,bids:[...a.bids]})),owned:{...m.owned},rivalOwned:{...m.rivalOwned},history:[...m.history]}; const notices:string[]=[]; let cashDelta=0;
  market.auctions=market.auctions.map(a=>a); for(const a of market.auctions.filter(a=>!a.resolved&&run.week>=a.closesWeek)){
    const ip=ipById(a.ipId)!;
    if(a.leadingStudioId==="player" && run.cash+cashDelta>=a.currentBid){
      const resolved={...a,resolved:true,winnerId:"player",winningBid:a.currentBid};
      market={...market,auctions:market.auctions.map(x=>x.id===a.id?resolved:x),owned:{...market.owned,[ip.id]:makeContract(ip,run.week,a.currentBid)},pendingPromptId:market.pendingPromptId===a.id?null:market.pendingPromptId,history:[...market.history,`Rights won: ${ip.title} for £${a.currentBid.toLocaleString("en-GB")}.`].slice(-100)};
      cashDelta-=a.currentBid; notices.push(`🏆 Rights won: ${ip.title}.`);
    }else{
      market=resolveForAI(market,a,world,rng);notices.push(`${ip.title} auction closed.`);
    }
  }'''
          if old not in s: raise SystemExit('tick expiry block not found')
          s=s.replace(old,new,1)
          s=s.replace('market.history=[...market.history,...notices].slice(-100);return {market,cashDelta:0,notices,world};','market.history=[...market.history,...notices].slice(-100);return {market,cashDelta,notices,world};')
          ip.write_text(s,encoding='utf-8')

          p=Path('game_source/src/engine/__tests__/ip-expansion.test.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('placePlayerBid, tickIPMarket','placeLivePlayerBid, placePlayerBid, tickIPMarket')
          t=t.replace('assigns immutable poster slots inside the 80-asset contract','assigns immutable poster slots inside the 100-asset contract')
          t=t.replace('x.posterSlot<=80','x.posterSlot<=100')
          oldtest=''' it("lets stateful rivals outbid a weak player during a live auction",()=>{const ip=AUCTION_IPS[0];const run=initialRun("A","steady");const m=initIPMarket(0);m.auctions=[{id:"a",ipId:ip.id,type:"open",opensWeek:0,closesWeek:4,currentBid:10_000,leadingStudioId:"player",playerMaxBid:10_000,bids:[],appraisalLevel:0,resolved:false,winnerId:null,winningBid:0}];const out=tickIPMarket(m,{week:1,cash:99_000,fans:0,awards:0,bestScore:0,showsMade:0},run.rivalWorld,()=>0);expect(out.market.auctions[0].leadingStudioId).not.toBe("player");expect(out.market.auctions[0].bids[out.market.auctions[0].bids.length-1]?.studioId).not.toBe("player");});'''
          newtest=''' it("lets stateful rivals immediately counter a weak live-room bid",()=>{const ip=AUCTION_IPS[0];const run=initialRun("A","steady");const m=initIPMarket(0);m.auctions=[{id:"a",ipId:ip.id,type:"open",opensWeek:0,closesWeek:1,currentBid:10_000,leadingStudioId:null,playerMaxBid:0,bids:[],appraisalLevel:0,resolved:false,winnerId:null,winningBid:0}];const out=placeLivePlayerBid(m,"a",20_000,99_000,0,run.rivalWorld,()=>0)!;expect(out.market.auctions[0].leadingStudioId).not.toBe("player");expect(out.market.auctions[0].bids[out.market.auctions[0].bids.length-1]?.studioId).not.toBe("player");});'''
          if oldtest not in t: raise SystemExit('old rival tick test not found')
          t=t.replace(oldtest,newtest,1)
          p.write_text(t,encoding='utf-8')

          c=Path('game_source/src/engine/__tests__/content-v3.test.ts')
          d=c.read_text(encoding='utf-8')
          d=d.replace('import { ARCS, ARC_COMBOS, CAST_V2, WORKER_LOOKS } from "../data";','import { ARCS, ARC_COMBOS, CAST_V2, WORKER_LOOKS } from "../data";\nimport { AUCTION_IPS } from "../ip";')
          d=d.replace('expect(ARCS).toHaveLength(90); expect(ARC_COMBOS).toHaveLength(49);\n    expect(new Set(ARCS.map(a => a.id)).size).toBe(90);\n    expect(new Set(ARC_COMBOS.map(a => a.id)).size).toBe(49);','expect(ARCS).toHaveLength(90 + AUCTION_IPS.length); expect(ARC_COMBOS).toHaveLength(49 + AUCTION_IPS.length);\n    expect(new Set(ARCS.map(a => a.id)).size).toBe(ARCS.length);\n    expect(new Set(ARC_COMBOS.map(a => a.id)).size).toBe(ARC_COMBOS.length);')
          c.write_text(d,encoding='utf-8')
          PY
      - name: Run full test suite and production build
        working-directory: game_source
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit verified fixes and clean temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/temp-auction-ceremony.yml .github/workflows/temp-auction-ceremony-v2.yml .github/workflows/temp-auction-ceremony-v3.yml .github/workflows/temp-auction-ceremony-v4.yml .github/workflows/temp-auction-debug.yml .github/workflows/temp-auction-fix-tests-v5.yml .auction-debug.txt .auction-ci-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify annual live auction and source arcs"
          git pull --rebase origin work/auction-ceremony-hidden-arcs
          git push origin HEAD:work/auction-ceremony-hidden-arcs
