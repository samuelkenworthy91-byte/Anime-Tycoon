name: Minimal auction docs cleanup

on:
  push:
    branches:
      - work/auction-ceremony-hidden-arcs
    paths:
      - .github/workflows/auction-final-cleanup-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auction-ceremony-hidden-arcs
          fetch-depth: 0
      - name: Clean docs only
        shell: bash
        run: |
          set -e
          git checkout dadd6f97347891ec7afa83b73856a2c8cf7d90ff -- game_source/docs/SCORING_BALANCE_MATRIX.json
          head -n 81 game_source/docs/USER_AUCTION_IP_HIDDEN_ARCS.csv > /tmp/hidden-arcs.csv
          cat /tmp/hidden-arcs.csv > game_source/docs/USER_AUCTION_IP_HIDDEN_ARCS.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/docs/SCORING_BALANCE_MATRIX.json game_source/docs/USER_AUCTION_IP_HIDDEN_ARCS.csv
          git commit -m "Align auction documentation to live 80-IP catalogue"
          git push origin HEAD:work/auction-ceremony-hidden-arcs
