name: Genre 30 Static Patch

on:
  push:
    branches:
      - work/genre30-full-integration
    paths:
      - game_source/scripts/finalize-genre30-static.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply static 30-genre patches
        run: node game_source/scripts/finalize-genre30-static.mjs
      - name: Commit patched sources
        run: |
          rm -f game_source/scripts/finalize-genre30-static.mjs .github/workflows/genre30-static-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize 30-genre runtime and regression surfaces"
          git push origin HEAD:work/genre30-full-integration
