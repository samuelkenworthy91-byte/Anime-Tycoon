name: Clean final auction documentation

on:
  push:
    branches:
      - work/auction-ceremony-hidden-arcs
    paths:
      - .github/workflows/auction-final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/auction-ceremony-hidden-arcs
          fetch-depth: 0
      - name: Remove test-generated noise and align hidden-arc docs to 80
        run: |
          git fetch origin main
          git checkout origin/main -- game_source/docs/SCORING_BALANCE_MATRIX.json
          head -n 81 game_source/docs/USER_AUCTION_IP_HIDDEN_ARCS.csv > /tmp/hidden-arcs.csv
          mv /tmp/hidden-arcs.csv game_source/docs/USER_AUCTION_IP_HIDDEN_ARCS.csv
          rm -f .github/workflows/auction-final-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean auction integration documentation"
          git pull --rebase origin work/auction-ceremony-hidden-arcs
          git push origin HEAD:work/auction-ceremony-hidden-arcs
