name: Rush Edit Spectacle CI

on:
  push:
    branches:
      - feature/deeper-studio-loop
    paths:
      - ".github/workflows/rush-edit-spectacle-ci.yml"
      - "tools/apply_rush_edit_spectacle.py"
      - "tools/fix_rush_edit_spectacle_compile.py"
      - "tools/fix_fast_full_recovery.py"

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deeper-studio-loop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Apply tuning
        run: |
          python tools/apply_rush_edit_spectacle.py
          python tools/fix_rush_edit_spectacle_compile.py
          python tools/fix_fast_full_recovery.py
      - name: Typecheck
        working-directory: game_source
        run: npx tsc --noEmit
      - name: Test
        working-directory: game_source
        run: npm test || npm test
      - name: Build
        working-directory: game_source
        run: npm run build
      - name: Commit implementation and browser build
        run: |
          git config user.name "samuelkenworthy91-byte"
          git config user.email "samuel.kenworthy91@gmail.com"
          git add game_source
          git add -f game_source/dist
          git commit -m "Make rushes explosive and editing open ended"
          git push origin HEAD:feature/deeper-studio-loop
