name: QoL Mix Balance Validation
# temporary PR validation for QoL pass 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Run production mix regression tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/production-mix-balance.test.ts scripts/scoring-balance.test.ts --reporter=verbose
      - name: Run full test suite
        working-directory: game_source
        run: npm test
      - name: Build production web app
        working-directory: game_source
        run: npm run build
