name: Research Showrunner Depth Baseline

on:
  push:
    branches:
      - work/research-showrunner-auction-depth-pass
    paths:
      - .github/workflows/research-showrunner-depth-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Test
        working-directory: game_source
        run: npm test
      - name: Build
        working-directory: game_source
        run: npm run build
