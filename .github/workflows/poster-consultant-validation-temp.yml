name: Poster Consultant QoL Validation
on:
  push:
    branches: [qol-poster-consultant-pass-2026-09-20]
    paths:
      - "game_source/**"
      - ".github/workflows/poster-consultant-validation-temp.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Focused QoL tests
        working-directory: game_source
        run: npx vitest run src/engine/__tests__/production-investment.test.ts src/engine/__tests__/rivalPosters.test.ts src/engine/__tests__/shared-industry-posters.test.ts src/engine/__tests__/facilities.test.ts src/engine/__tests__/poster-franchise-ownership.test.ts --reporter=verbose
      - name: Full tests
        working-directory: game_source
        run: npm test
      - name: Production build
        working-directory: game_source
        run: npm run build
