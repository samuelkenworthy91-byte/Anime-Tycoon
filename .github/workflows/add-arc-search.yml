name: Add arc search

on:
  push:
    paths:
      - ".github/workflows/add-arc-search.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Add searchable story arc catalogue
        working-directory: game_source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/Create.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const stateNeedle = '  const [castFilters, setCastFilters] = useState<CastBrowseFilter[]>([]);\n';
          if (!text.includes(stateNeedle)) throw new Error('Could not find cast filter state insertion point');
          text = text.replace(
            stateNeedle,
            stateNeedle + '  const [arcSearch, setArcSearch] = useState("");\n'
          );

          const stepNeedle = '  const stepValid =\n';
          if (!text.includes(stepNeedle)) throw new Error('Could not find step validation insertion point');
          const searchLogic = `  const searchableArcs = useMemo(\n    () => ARCS.filter((a) => a.unlock?.kind !== "studioArc" || run.ipMarket.studioArcs.includes(a.id)),\n    [run.ipMarket.studioArcs]\n  );\n  const visibleArcs = useMemo(() => {\n    const query = arcSearch.trim().toLowerCase();\n    if (!query) return searchableArcs;\n    return searchableArcs.filter((a) =>\n      a.name.toLowerCase().includes(query) || (a.desc ?? "").toLowerCase().includes(query)\n    );\n  }, [arcSearch, searchableArcs]);\n\n`;
          text = text.replace(stepNeedle, searchLogic + stepNeedle);

          const listNeedle = '{ARCS.filter((a) => a.unlock?.kind !== "studioArc" || run.ipMarket.studioArcs.includes(a.id)).map((a) => {';
          if (!text.includes(listNeedle)) throw new Error('Could not find story arc catalogue map');
          text = text.replace(listNeedle, '{visibleArcs.map((a) => {');

          const gridNeedle = `                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">\n                  {visibleArcs.map((a) => {`;
          if (!text.includes(gridNeedle)) throw new Error('Could not find story arc grid insertion point');
          const searchUi = `                <div className="rounded-xl border border-line bg-panel2/60 p-2.5">\n                  <div className="flex items-center gap-2">\n                    <input\n                      type="search"\n                      value={arcSearch}\n                      onChange={(e) => setArcSearch(e.target.value)}\n                      placeholder="Search arcs by name or plot…"\n                      aria-label="Search story arcs"\n                      className="ink-input min-w-0 flex-1 px-3 py-2 text-xs"\n                    />\n                    {arcSearch && (\n                      <button\n                        type="button"\n                        onClick={() => setArcSearch("")}\n                        aria-label="Clear arc search"\n                        className="btn-press rounded-lg border border-line bg-panel3 p-2 text-paper/55 hover:border-neon/50 hover:text-paper"\n                      >\n                        <X size={14} />\n                      </button>\n                    )}\n                  </div>\n                  <div className="mt-1 text-[9px] text-paper/40">\n                    Showing {visibleArcs.length} of {searchableArcs.length} arcs\n                  </div>\n                </div>\n                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">\n                  {visibleArcs.map((a) => {`;
          text = text.replace(gridNeedle, searchUi);

          if ((text.match(/const \[arcSearch, setArcSearch\]/g) ?? []).length !== 1) throw new Error('arcSearch state count is not exactly one');
          if ((text.match(/Search arcs by name or plot/g) ?? []).length !== 1) throw new Error('Arc search UI count is not exactly one');
          if (text.includes(listNeedle)) throw new Error('Unfiltered story arc map remains');

          fs.writeFileSync(path, text);
          console.log('Added story arc name/plot search with clear button and result count.');
          NODE

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build production web app
        working-directory: game_source
        run: npm run build

      - name: Commit verified arc search
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/src/components/Create.tsx
          git commit -m "Add search to story arc picker"
          git push origin HEAD:main
