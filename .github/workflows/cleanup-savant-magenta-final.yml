name: Remove Residual Production Savant Magenta

on:
  push:
    branches:
      - work/research-showrunner-auction-depth-pass
    paths:
      - .github/workflows/cleanup-savant-magenta-final.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/research-showrunner-auction-depth-pass
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Remove all residual magenta key pixels from existing artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              (Path('game_source/public/img/portrait-showrunner-savant.webp'), (128, 128)),
              (Path('game_source/public/img/sprite-showrunner-savant.webp'), (224, 320)),
          ]

          def residual_magenta(px):
              r, g, b, a = px
              return (
                  a > 0
                  and r >= 115
                  and b >= 105
                  and g <= 205
                  and (r - g) >= 18
                  and (b - g) >= 18
                  and abs(r - b) <= 155
              )

          for path, expected_size in files:
              im = Image.open(path).convert('RGBA')
              assert im.size == expected_size, f'{path}: unexpected size {im.size}'
              px = im.load()
              before = sum(1 for p in im.getdata() if residual_magenta(p))

              removed = 0
              for y in range(im.height):
                  for x in range(im.width):
                      r, g, b, a = px[x, y]
                      if residual_magenta((r, g, b, a)):
                          px[x, y] = (0, 0, 0, 0)
                          removed += 1
                      elif a == 0 and (r or g or b):
                          px[x, y] = (0, 0, 0, 0)

              after = sum(1 for p in im.getdata() if residual_magenta(p))
              assert before == removed, f'{path}: did not remove every detected magenta pixel ({before=} {removed=})'
              assert after == 0, f'{path}: residual magenta remains: {after}'
              assert im.getbbox(), f'{path}: image became empty'
              lo, hi = im.getchannel('A').getextrema()
              assert (lo, hi) == (0, 255), f'{path}: unexpected alpha range {(lo, hi)}'

              im.save(path, 'WEBP', lossless=True, method=6, exact=True)

              check = Image.open(path).convert('RGBA')
              assert check.size == expected_size
              after_reopen = sum(1 for p in check.getdata() if residual_magenta(p))
              assert after_reopen == 0, f'{path}: magenta returned after save: {after_reopen}'
              print(f'{path}: removed {removed} residual magenta pixels; remaining=0; size={im.size}; alpha={lo}..{hi}; bytes={path.stat().st_size}')
          PY

      - name: Commit exact cleaned repo artwork and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-savant-magenta-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game_source/public/img/portrait-showrunner-savant.webp \
                  game_source/public/img/sprite-showrunner-savant.webp \
                  .github/workflows/cleanup-savant-magenta-final.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove residual Production Savant magenta key pixels [skip ci]"
          git push origin HEAD:work/research-showrunner-auction-depth-pass
