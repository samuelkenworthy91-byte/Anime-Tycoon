name: Passion project creator vision pass

on:
  push:
    branches:
      - work/passion-project-creator-vision

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[creator-vision-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/passion-project-creator-vision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Apply creator vision patch
        working-directory: game_source
        run: node scripts/apply-passion-project-creator-vision.mjs
      - name: Install dependencies
        working-directory: game_source
        run: npm ci
      - name: Test
        working-directory: game_source
        run: npm test
      - name: Build
        working-directory: game_source
        run: npm run build
      - name: Commit implementation
        run: |
          rm -f game_source/scripts/apply-passion-project-creator-vision.mjs
          rm -f .github/workflows/passion-project-creator-vision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement creator-led passion projects [creator-vision-patch]"
          git push origin HEAD:work/passion-project-creator-vision
