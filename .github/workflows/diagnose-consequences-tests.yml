name: Diagnose consequences tests

on:
  push:
    branches:
      - work/consequences-discovery-critical-voice
    paths:
      - ".github/workflows/diagnose-consequences-tests.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/consequences-discovery-critical-voice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json
      - name: Install
        working-directory: game_source
        run: npm ci
      - name: Capture full test output
        working-directory: game_source
        shell: bash
        run: |
          set +e
          npm test > ../TEST_FAILURES.tmp.txt 2>&1
          code=$?
          echo "TEST_EXIT_CODE=$code" >> ../TEST_FAILURES.tmp.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEST_FAILURES.tmp.txt
          git commit -m "TEMP capture consequences test output"
          git push origin HEAD:work/consequences-discovery-critical-voice
