name: Consume Cast V4 Upload

on:
  push:
    branches:
      - work/cast-v4-runtime-integration
    paths:
      - "CAST_V4_UPLOAD_TO_WORK_BRANCH.zip"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Expand Cast V4 payload
        run: |
          test -f CAST_V4_UPLOAD_TO_WORK_BRANCH.zip
          unzip -o CAST_V4_UPLOAD_TO_WORK_BRANCH.zip -d .
          rm CAST_V4_UPLOAD_TO_WORK_BRANCH.zip
          test "$(find game_source/public/cast/v4 -maxdepth 1 -name '*.webp' | wc -l)" -eq 304

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Regenerate and validate canonical content
        working-directory: game_source
        run: npm run content-v3:generate

      - name: Run tests
        working-directory: game_source
        run: npm test

      - name: Build web app
        working-directory: game_source
        run: npm run build

      - name: Commit validated Cast V4 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/cast-v4-consume-upload.yml
          git add -A
          git commit -m "feat: integrate Cast V4 runtime roster"
          git push origin HEAD:work/cast-v4-runtime-integration
