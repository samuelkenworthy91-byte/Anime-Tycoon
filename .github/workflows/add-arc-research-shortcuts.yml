name: Add Arc Research Shortcuts

on:
  push:
    branches:
      - work/staff-potential-ip-business-pass
    paths:
      - game_source/scripts/add_arc_research_shortcuts.py
      - .github/workflows/add-arc-research-shortcuts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/staff-potential-ip-business-pass
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_source/package-lock.json

      - name: Install dependencies
        working-directory: game_source
        run: npm ci

      - name: Apply research shortcut patch
        working-directory: game_source
        run: python3 scripts/add_arc_research_shortcuts.py

      - name: Run full test suite
        working-directory: game_source
        run: npm test

      - name: Build production app
        working-directory: game_source
        run: npm run build

      - name: Commit validated shortcuts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-arc-research-shortcuts.yml
          git rm game_source/scripts/add_arc_research_shortcuts.py
          git add game_source/src/components/Create.tsx
          git commit -m "Add direct researched arc and combo shortcuts"
          git push origin HEAD:work/staff-potential-ip-business-pass
